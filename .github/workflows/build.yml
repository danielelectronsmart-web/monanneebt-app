name: Construire APK et logiciel Windows

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Préparer les fichiers (index.html à la racine suffit)
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p www electron android-signing
          if [ -f index.html ]; then cp index.html www/index.html; fi
          if [ ! -f www/index.html ]; then echo "ERREUR : envoie le fichier index.html à la racine du dépôt"; exit 1; fi
          cat > electron/main.js <<'MAINJS'
          const { app, BrowserWindow, shell, Menu } = require('electron');
          const path = require('path');
          
          function createWindow() {
            const win = new BrowserWindow({
              width: 1200,
              height: 820,
              minWidth: 380,
              title: 'Mon année BT',
              backgroundColor: '#0E4A36',
              webPreferences: { contextIsolation: true, spellcheck: true, webSecurity: false } // appli locale : permet d'appeler toutes les IA
            });
            Menu.setApplicationMenu(null);
            // Les liens externes (Google, YouTube, Gemini…) s'ouvrent dans le navigateur
            win.webContents.setWindowOpenHandler(({ url }) => { shell.openExternal(url); return { action: 'deny' }; });
            win.loadFile(path.join(__dirname, '..', 'www', 'index.html'));
          }
          
          // Nécessaire pour que Windows affiche les notifications de rappel
          if (process.platform === 'win32') app.setAppUserModelId('ci.daniel.monanneebt');
          
          app.whenReady().then(() => {
            // Autoriser le micro (enregistrement des cours)
            require('electron').session.defaultSession.setPermissionRequestHandler((wc, perm, cb) => cb(['media', 'notifications'].includes(perm)));
            createWindow();
            app.on('activate', () => { if (BrowserWindow.getAllWindows().length === 0) createWindow(); });
          });
          app.on('window-all-closed', () => { if (process.platform !== 'darwin') app.quit(); });
          MAINJS
          if [ ! -f package.json ]; then cat > package.json <<'PKGJSON'
          {
            "name": "mon-annee-bt",
            "version": "1.0.0",
            "description": "Mon année BT : organisation scolaire et étude avec l'IA",
            "author": "BAYILE Jean Daniel",
            "main": "electron/main.js",
            "scripts": {
              "start": "electron .",
              "build:win": "electron-builder --win nsis portable"
            },
            "build": {
              "appId": "ci.daniel.monanneebt",
              "productName": "Mon année BT",
              "files": [
                "electron/**",
                "www/**"
              ],
              "directories": {
                "output": "dist"
              },
              "win": {
                "target": [
                  "nsis",
                  "portable"
                ]
              },
              "nsis": {
                "oneClick": false,
                "allowToChangeInstallationDirectory": true,
                "shortcutName": "Mon année BT"
              }
            },
            "devDependencies": {
              "electron": "latest",
              "electron-builder": "latest"
            }
          }
          PKGJSON
          fi
          if [ ! -f capacitor.config.json ]; then cat > capacitor.config.json <<'CAPJSON'
          {
            "appId": "ci.daniel.monanneebt",
            "appName": "Mon année BT",
            "webDir": "www"
          }
          CAPJSON
          fi
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > android-signing/debug.keystore; fi
          ls -la www electron android-signing
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Préparer le SDK Android (déjà installé sur GitHub)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Installer Capacitor et les plugins
        run: |
          npm install --save --omit=dev --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share @capacitor/local-notifications @capacitor-community/text-to-speech
      - name: Créer le projet Android
        run: |
          npx cap add android
          # Autoriser la caméra (photos du cours) et le micro
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Signature fixe + numéro de version (permet d'installer les mises à jour par-dessus sans perdre les données)
        run: |
          mkdir -p ~/.android
          if [ -f android-signing/debug.keystore ]; then cp android-signing/debug.keystore ~/.android/debug.keystore; else echo "::warning::Pas de secret KEYSTORE_B64 : APK signé avec une clé temporaire (les mises à jour devront être réinstallées)."; fi
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - name: Compiler l'APK
        id: build1
        continue-on-error: true
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Plan B (sans le plugin de voix si incompatible)
        if: steps.build1.outcome == 'failure'
        run: |
          npm uninstall --legacy-peer-deps @capacitor-community/text-to-speech
          npx cap sync android
          cd android && ./gradlew assembleDebug
      - name: Renommer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "MonAnneeBT.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: MonAnneeBT-Android
          path: MonAnneeBT.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Préparer les fichiers (index.html à la racine suffit)
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p www electron android-signing
          if [ -f index.html ]; then cp index.html www/index.html; fi
          if [ ! -f www/index.html ]; then echo "ERREUR : envoie le fichier index.html à la racine du dépôt"; exit 1; fi
          cat > electron/main.js <<'MAINJS'
          const { app, BrowserWindow, shell, Menu } = require('electron');
          const path = require('path');
          
          function createWindow() {
            const win = new BrowserWindow({
              width: 1200,
              height: 820,
              minWidth: 380,
              title: 'Mon année BT',
              backgroundColor: '#0E4A36',
              webPreferences: { contextIsolation: true, spellcheck: true, webSecurity: false } // appli locale : permet d'appeler toutes les IA
            });
            Menu.setApplicationMenu(null);
            // Les liens externes (Google, YouTube, Gemini…) s'ouvrent dans le navigateur
            win.webContents.setWindowOpenHandler(({ url }) => { shell.openExternal(url); return { action: 'deny' }; });
            win.loadFile(path.join(__dirname, '..', 'www', 'index.html'));
          }
          
          // Nécessaire pour que Windows affiche les notifications de rappel
          if (process.platform === 'win32') app.setAppUserModelId('ci.daniel.monanneebt');
          
          app.whenReady().then(() => {
            // Autoriser le micro (enregistrement des cours)
            require('electron').session.defaultSession.setPermissionRequestHandler((wc, perm, cb) => cb(['media', 'notifications'].includes(perm)));
            createWindow();
            app.on('activate', () => { if (BrowserWindow.getAllWindows().length === 0) createWindow(); });
          });
          app.on('window-all-closed', () => { if (process.platform !== 'darwin') app.quit(); });
          MAINJS
          if [ ! -f package.json ]; then cat > package.json <<'PKGJSON'
          {
            "name": "mon-annee-bt",
            "version": "1.0.0",
            "description": "Mon année BT : organisation scolaire et étude avec l'IA",
            "author": "BAYILE Jean Daniel",
            "main": "electron/main.js",
            "scripts": {
              "start": "electron .",
              "build:win": "electron-builder --win nsis portable"
            },
            "build": {
              "appId": "ci.daniel.monanneebt",
              "productName": "Mon année BT",
              "files": [
                "electron/**",
                "www/**"
              ],
              "directories": {
                "output": "dist"
              },
              "win": {
                "target": [
                  "nsis",
                  "portable"
                ]
              },
              "nsis": {
                "oneClick": false,
                "allowToChangeInstallationDirectory": true,
                "shortcutName": "Mon année BT"
              }
            },
            "devDependencies": {
              "electron": "latest",
              "electron-builder": "latest"
            }
          }
          PKGJSON
          fi
          if [ ! -f capacitor.config.json ]; then cat > capacitor.config.json <<'CAPJSON'
          {
            "appId": "ci.daniel.monanneebt",
            "appName": "Mon année BT",
            "webDir": "www"
          }
          CAPJSON
          fi
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > android-signing/debug.keystore; fi
          ls -la www electron android-signing
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer Electron
        run: npm install
      - name: Construire le logiciel Windows
        run: npx electron-builder --win nsis portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: MonAnneeBT-Windows
          path: dist/*.exe

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: sortie
      - name: Publier une version téléchargeable (lien pour les amis)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Mon année BT v1.${{ github.run_number }}
          make_latest: true
          body: |
            📱 Android : télécharge MonAnneeBT.apk puis ouvre-le sur ton téléphone.
            💻 Windows : télécharge le fichier « Setup » .exe.
            Au premier lancement, l'appli te guide (profil, matières, emploi du temps, couleurs, IA gratuite).
          files: |
            sortie/MonAnneeBT-Android/*.apk
            sortie/MonAnneeBT-Windows/*.exe

  web:
    # Version web installable (iPhone, ordinateur, Android sans fichier). Si les « Pages » GitHub ne sont pas activées, ce travail échoue sans gêner le reste.
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le site web installable
        shell: bash
        run: |
          set -e
          mkdir -p _site
          if [ -f index.html ]; then cp index.html _site/index.html; elif [ -f www/index.html ]; then cp www/index.html _site/index.html; else echo "ERREUR : envoie le fichier index.html à la racine du dépôt"; exit 1; fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          cat > _site/icon.svg <<'ICONSVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"><rect width="512" height="512" fill="#FFF1DC"/><circle cx="256" cy="256" r="236" fill="#FFE2B8"/><svg x="86" y="72" width="340" height="351" viewBox="0 0 120 124"><path d="M36 104h48v8a8 8 0 0 1-8 8H44a8 8 0 0 1-8-8z" fill="#0E4A36"/><path d="M62 106l-7 9h5l-2 7 9-10h-5z" fill="#E8891C"/><path d="M22 70a38 38 0 0 1 76 0" fill="none" stroke="#E8891C" stroke-width="5" stroke-linecap="round"/><rect x="9" y="60" width="13" height="26" rx="6" fill="#E8891C"/><rect x="98" y="60" width="13" height="26" rx="6" fill="#E8891C"/><rect x="20" y="36" width="80" height="68" rx="24" fill="#0E4A36"/><rect x="29" y="46" width="62" height="52" rx="18" fill="#F2FAF5"/><line x1="60" y1="36" x2="60" y2="19" stroke="#0E4A36" stroke-width="4" stroke-linecap="round"/><circle cx="60" cy="15" r="6" fill="#E8891C"/><circle cx="60" cy="15" r="10" fill="#E8891C" opacity=".22"/><circle cx="46" cy="66" r="6.5" fill="#12332A"/><circle cx="74" cy="66" r="6.5" fill="#12332A"/><circle cx="48.2" cy="63.8" r="2.2" fill="#fff"/><circle cx="76.2" cy="63.8" r="2.2" fill="#fff"/><circle cx="36" cy="78" r="4.5" fill="#F29BA8" opacity=".55"/><circle cx="84" cy="78" r="4.5" fill="#F29BA8" opacity=".55"/><path d="M51 80q9 8 18 0" fill="none" stroke="#12332A" stroke-width="3.2" stroke-linecap="round"/></svg></svg>
          ICONSVG
          rsvg-convert -w 192 -h 192 _site/icon.svg -o _site/icon-192.png
          rsvg-convert -w 512 -h 512 _site/icon.svg -o _site/icon-512.png
          rm _site/icon.svg
          cat > _site/manifest.webmanifest <<'MANIFEST'
          {
            "name": "Mon année BT",
            "short_name": "Année BT",
            "description": "Organisation scolaire et étude avec l'IA",
            "lang": "fr",
            "start_url": "./",
            "scope": "./",
            "display": "standalone",
            "background_color": "#0C5E45",
            "theme_color": "#0C5E45",
            "icons": [
              { "src": "icon-192.png", "sizes": "192x192", "type": "image/png", "purpose": "any maskable" },
              { "src": "icon-512.png", "sizes": "512x512", "type": "image/png", "purpose": "any maskable" }
            ]
          }
          MANIFEST
          cat > _site/sw.js <<'SWJS'
          const V='anneebt-__VERSION__',F='anneebt-polices';
          const CORE=['./','./index.html','./manifest.webmanifest','./icon-192.png','./icon-512.png'];
          self.addEventListener('install',e=>{e.waitUntil(caches.open(V).then(c=>c.addAll(CORE)).then(()=>self.skipWaiting()))});
          self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(x=>x!==V&&x!==F).map(x=>caches.delete(x)))).then(()=>self.clients.claim()))});
          self.addEventListener('fetch',e=>{
            const r=e.request;if(r.method!=='GET')return;
            const u=new URL(r.url);
            if(u.origin===location.origin){
              /* la page vient d'abord d'Internet (toujours la dernière version) ; sans réseau, la copie gardée prend le relais */
              e.respondWith(fetch(r).then(res=>{if(res.ok){const cp=res.clone();caches.open(V).then(c=>c.put(r,cp))}return res}).catch(()=>caches.match(r,{ignoreSearch:true}).then(m=>m||caches.match('./index.html'))));
            }else if(/^fonts\.(googleapis|gstatic)\.com$/.test(u.hostname)){
              e.respondWith(caches.open(F).then(c=>c.match(r).then(m=>m||fetch(r).then(res=>{c.put(r,res.clone());return res}))));
            }
          });
          SWJS
          sed -i "s/__VERSION__/${GITHUB_SHA::8}/" _site/sw.js
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Mettre le site en ligne
        id: deploy
        uses: actions/deploy-pages@v4
