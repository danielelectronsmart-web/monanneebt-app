const ICON_MAP=Object.fromEntries(Object.entries(ICON_RAW).map(([k,v])=>[k.replace(/\uFE0F|\uFE0E/g,''),v]));
const EMO_RE=/(?:\p{Extended_Pictographic}\uFE0F?(?:\u200D\p{Extended_Pictographic}\uFE0F?)*|[\u{1F1E6}-\u{1F1FF}]|[☰✕✓↺])/gu;
const emoNorm=t=>t.replace(/\uFE0F|\uFE0E/g,'');
function iconSvg(spec){const [n,m]=spec.split(':');return `<svg class="pi pi-${n}${m?' pi-'+m:''}" aria-hidden="true" focusable="false"><use href="#i-${n}"></use></svg>`}
function stripEmoji(t){return String(t==null?'':t).replace(EMO_RE,x=>ICON_MAP[emoNorm(x)]!==undefined?'':x).replace(/[ \t]+\n/g,'\n').replace(/^[ \t]+/gm,'').replace(/ {2,}/g,' ').trim()}
(()=>{
  if(document.getElementById('spriteIcons'))return;
  const sp=document.createElement('div');sp.innerHTML=`<svg id="spriteIcons" width="0" height="0" style="position:absolute" aria-hidden="true"><defs>${Object.entries(ICONS).map(([k,v])=>`<symbol id="i-${k}" viewBox="0 0 24 24">${v}</symbol>`).join('')}</defs></svg>`;
  document.body.prepend(sp.firstChild);
  const SKIP=new Set(['SCRIPT','STYLE','TEXTAREA','INPUT','OPTION','SELECT','CODE','PRE','TITLE','svg','SVG']);
  const skipEl=el=>{for(let n=el;n&&n!==document.body;n=n.parentElement){if(SKIP.has(n.tagName))return true;if(n.classList&&(n.classList.contains('reading')||n.classList.contains('msg')&&n.classList.contains('user')))return true;if(n.hasAttribute&&(n.hasAttribute('data-noicon')||n.isContentEditable))return true}return false};
  const esc2=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  function toHtml(txt){
    let out='',last=0,hit=false;EMO_RE.lastIndex=0;let m;
    while((m=EMO_RE.exec(txt))){const spec=ICON_MAP[emoNorm(m[0])];if(spec===undefined)continue;hit=true;
      let before=txt.slice(last,m.index);
      if(spec===''){if(/\s$/.test(before)||before==='')last=EMO_RE.lastIndex+(txt[EMO_RE.lastIndex]===' '?1:0);else last=EMO_RE.lastIndex;out+=esc2(before);continue}
      out+=esc2(before)+iconSvg(spec);last=EMO_RE.lastIndex}
    return hit?out+esc2(txt.slice(last)):null}
  function procText(n){if(!n.parentNode||skipEl(n.parentElement))return;const h=toHtml(n.nodeValue);if(h===null)return;const t=document.createElement('template');t.innerHTML=h;n.replaceWith(t.content)}
  function iconify(root){
    if(!root)return;
    if(root.nodeType===3){procText(root);return}
    if(root.nodeType!==1||skipEl(root.parentElement)&&root!==document.body)return;
    if(root.matches&&root.matches('.x')&&root.textContent.trim()==='×'&&!root.querySelector('svg'))root.innerHTML=iconSvg('x');
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),list=[];let n;
    while((n=w.nextNode())){EMO_RE.lastIndex=0;if(EMO_RE.test(n.nodeValue))list.push(n)}
    list.forEach(procText);
    root.querySelectorAll('.x').forEach(b=>{if(b.textContent.trim()==='×'&&!b.querySelector('svg'))b.innerHTML=iconSvg('x')});
    root.querySelectorAll('option').forEach(o=>{EMO_RE.lastIndex=0;if(EMO_RE.test(o.textContent))o.textContent=stripEmoji(o.textContent)});
    root.querySelectorAll('[placeholder],[title],[aria-label],[alt]').forEach(el=>['placeholder','title','aria-label','alt'].forEach(a=>{const v=el.getAttribute(a);if(v){EMO_RE.lastIndex=0;if(EMO_RE.test(v))el.setAttribute(a,stripEmoji(v))}}));
  }
  window.iconify=iconify;
  const pending=new Set();let sched=false;
  const flush=()=>{sched=false;const arr=[...pending];pending.clear();arr.forEach(n=>{if(n.isConnected)iconify(n)})};
  new MutationObserver(recs=>{for(const r of recs){if(r.type==='characterData')pending.add(r.target);else r.addedNodes.forEach(n=>pending.add(n))}if(!sched){sched=true;queueMicrotask(flush)}}).observe(document.body,{childList:true,subtree:true,characterData:true});
  ['alert','confirm','prompt'].forEach(k=>{const o=window[k]&&window[k].bind(window);if(o)window[k]=function(m,...r){return o(stripEmoji(m),...r)}});
  iconify(document.body);
})();

/* --- chiffrement des clés avant envoi dans le cloud (AES-GCM, clé dérivée du code secret) --- */
const cryptoOK=()=>!!(window.crypto&&crypto.subtle&&crypto.getRandomValues);
const b64e=u8=>{let s='';u8.forEach(b=>s+=String.fromCharCode(b));return btoa(s)};
const b64d=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
const dk={code:null,key:null};
async function deriveKey(code){
  if(dk.code===code&&dk.key)return dk.key;
  const enc=new TextEncoder(),base=await crypto.subtle.importKey('raw',enc.encode('monanneebt:'+code),'PBKDF2',false,['deriveKey']);
  dk.key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode('mon-annee-bt-sync-v1'),iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);dk.code=code;return dk.key}
async function encJSON(obj,code){const iv=crypto.getRandomValues(new Uint8Array(12)),k=await deriveKey(code);const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(obj))));return b64e(iv)+'.'+b64e(ct)}
async function decJSON(t,code){const [a,b]=String(t).split('.');const k=await deriveKey(code);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(a)},k,b64d(b));return JSON.parse(new TextDecoder().decode(pt))}

/* ================= Schémas : galerie visible, découpe au doigt, redessin IA ================= */
const SCHEMA_MODES=[['auto','Automatique'],['manuel','Je choisis'],['aucun','Ignorer']];
const smode=()=>state.settings.schemaMode||'auto';
const SC_RE=/\[\[(img|todo):([\w-]+)\]\]/g;
function schemaList(text){const out=[];let m;SC_RE.lastIndex=0;while((m=SC_RE.exec(text||'')))out.push({kind:m[1],id:m[2],tok:m[0]});return out}
function courseMediaIds(c){const s=new Set((c.photos||[]));schemaList(c.text).forEach(x=>s.add(x.id));return [...s]}
function loadImg(url){return new Promise((res,rej)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=()=>rej(new Error('image'));i.src=url})}
const escRe=t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
/* --- cadres : validation, marge généreuse, découpe --- */
function normBox(b){if(!Array.isArray(b)||b.length!==4)return null;let [y0,x0,y1,x1]=b.map(Number);if([y0,x0,y1,x1].some(v=>!isFinite(v)))return null;if(y1<y0)[y0,y1]=[y1,y0];if(x1<x0)[x0,x1]=[x1,x0];return [Math.max(0,y0),Math.max(0,x0),Math.min(1000,y1),Math.min(1000,x1)]}
function validBox(b){const n=normBox(b);if(!n)return false;const w=n[3]-n[1],h=n[2]-n[0];return w>=50&&h>=50&&w*h/1e6>=.015&&w*h/1e6<=.98}
function padBox(b){const n=normBox(b);if(!n)return null;const px=30+(n[3]-n[1])*.06,py=30+(n[2]-n[0])*.06;return [Math.max(0,n[0]-py),Math.max(0,n[1]-px),Math.min(1000,n[2]+py),Math.min(1000,n[3]+px)]}
async function cropBox(blob,box){
  const p=padBox(box);if(!p||!validBox(box))return null;
  const bmp=await createImageBitmap(blob),W=bmp.width,H=bmp.height;
  const sx=p[1]/1000*W,sy=p[0]/1000*H,w=Math.round((p[3]-p[1])/1000*W),h=Math.round((p[2]-p[0])/1000*H);if(w<30||h<30)return null;
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(bmp,sx,sy,w,h,0,0,w,h);
  return await new Promise(r=>c.toBlob(r,'image/jpeg',.92))}
async function uploadSchema(blob,meta){
  if(!caps.assets){alert("Impossible d'enregistrer l'image ici.");return null}
  try{const up=await caps.assets.upload(blob);draft.schemaSrc=draft.schemaSrc||{};draft.schemaSrc[up.id]=meta||{};return up.id}
  catch(e){alert("L'image du schéma n'a pas pu être enregistrée. Réessaie.");return null}}

/* --- galerie dans l'éditeur --- */

  <p class="meta" style="margin:4px 0 10px">${m==='auto'?"L'IA découpe les schémas toute seule. Tu peux corriger chaque découpe dans la liste « Schémas du cours » plus bas.":m==='manuel'?"L'IA repère où sont les schémas, et c'est toi qui les entoures avec ton doigt : plus précis.":"Seul le texte est gardé, les schémas sont ignorés."}</p>`}
function vSchemaGallery(){

/* --- choix de la photo --- */
function pickPhoto(ids){
  return new Promise(res=>{
    if(!ids.length){alert("Ajoute d'abord une photo du cours.");res(null);return}
    if(ids.length===1){res(ids[0]);return}
    const o=document.createElement('div');o.className='pickview';
    o.innerHTML=`<div class="crophead"><b>Dans quelle photo ?</b><button class="iconbtn" data-pick="" aria-label="Annuler">✕</button></div><div class="sgrid" style="max-width:900px;width:100%">${ids.map((id,i)=>`<button type="button" class="scard" data-pick="${id}" style="cursor:pointer"><img src="${photoUrl(id)}" alt="Photo ${i+1}"><b style="font-size:.85rem">Photo ${i+1}</b></button>`).join('')}</div>`;
    o.addEventListener('click',e=>{const b=e.target.closest('[data-pick]');if(!b)return;o.remove();res(b.dataset.pick||null)});
    document.body.appendChild(o)})}

/* --- outil de découpe au doigt --- */
var crop=null;
function rotC(c){const n=document.createElement('canvas');n.width=c.height;n.height=c.width;const g=n.getContext('2d');g.translate(n.width,0);g.rotate(Math.PI/2);g.drawImage(c,0,0);return n}
function closeCropper(){const o=document.getElementById('cropView');if(o)o.remove();crop=null}
function cropMsg(t){const m=document.getElementById('cropMsg');if(m)m.textContent=t}
function paintCrop(){const b=document.getElementById('cropBox');if(!b||!crop)return;const s=crop.st;b.style.left=s.x+'px';b.style.top=s.y+'px';b.style.width=s.w+'px';b.style.height=s.h+'px'}
function setCropBox(box){const n=normBox(box);if(!n||!crop)return;const W=crop.cw,H=crop.ch;crop.st={x:n[1]/1000*W,y:n[0]/1000*H,w:(n[3]-n[1])/1000*W,h:(n[2]-n[0])/1000*H};paintCrop()}
function layoutCrop(box){
  const cv=document.getElementById('cropCanvas'),W=crop.work.width,H=crop.work.height;
  const maxW=Math.min(window.innerWidth-24,900),maxH=Math.max(220,window.innerHeight*.58);
  crop.scale=Math.min(maxW/W,maxH/H,1.6);crop.cw=W*crop.scale;crop.ch=H*crop.scale;
  cv.width=W;cv.height=H;cv.style.width=crop.cw+'px';cv.style.height=crop.ch+'px';
  const g=cv.getContext('2d');if(g)g.drawImage(crop.work,0,0);
  const st=document.getElementById('cropStage');st.style.width=crop.cw+'px';st.style.height=crop.ch+'px';
  if(validBox(box))setCropBox(box);else{crop.st={x:crop.cw*.12,y:crop.ch*.12,w:crop.cw*.76,h:crop.ch*.76};paintCrop()}}
async function openCropper({srcId,box,rot=0,onDone}){
  closeCropper();
  let img;try{img=await loadImg(photoUrl(srcId))}catch(e){alert("Impossible d'ouvrir la photo.");return}
  let work=document.createElement('canvas');work.width=img.naturalWidth||img.width;work.height=img.naturalHeight||img.height;work.getContext('2d').drawImage(img,0,0);
  for(let i=0;i<(rot%4);i++)work=rotC(work);
  const o=document.createElement('div');o.id='cropView';o.className='cropview';
  o.innerHTML=`<div class="crophead"><b>Découpe ton schéma</b><button class="iconbtn" data-crop="close" aria-label="Fermer">✕</button></div>
    <p class="cropmsg" id="cropMsg">Déplace le cadre et tire les coins pour entourer tout le schéma, légendes comprises.</p>
    <div class="cropstage" id="cropStage"><canvas id="cropCanvas"></canvas><div class="cropbox" id="cropBox"><i data-h="nw"></i><i data-h="ne"></i><i data-h="sw"></i><i data-h="se"></i></div></div>
    <div class="cropbtns"><button class="btn ghost" data-crop="guess">Deviner avec l'IA</button><button class="btn ghost" data-crop="rotate">Pivoter</button><button class="btn ghost" data-crop="all">Photo entière</button><button class="btn" data-crop="ok">Valider</button></div>`;
  document.body.appendChild(o);
  crop={srcId,work,rot:rot%4,onDone,st:null,scale:1,guesses:[],gi:0};
  layoutCrop(box);
  const stage=document.getElementById('cropStage');let drag=null;
  stage.addEventListener('pointerdown',e=>{const r=stage.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,s=crop.st,h=e.target.dataset&&e.target.dataset.h;
    if(h)drag={t:'h',h,px,py,s:{...s}};else if(px>=s.x&&px<=s.x+s.w&&py>=s.y&&py<=s.y+s.h)drag={t:'m',px,py,s:{...s}};else return;
    if(stage.setPointerCapture)try{stage.setPointerCapture(e.pointerId)}catch(x){}e.preventDefault()});
  stage.addEventListener('pointermove',e=>{if(!drag||!crop)return;const r=stage.getBoundingClientRect(),dx=e.clientX-r.left-drag.px,dy=e.clientY-r.top-drag.py,W=crop.cw,H=crop.ch,s=drag.s,mn=36;
    if(drag.t==='m'){crop.st={x:Math.min(Math.max(0,s.x+dx),W-s.w),y:Math.min(Math.max(0,s.y+dy),H-s.h),w:s.w,h:s.h}}
    else{let x0=s.x,y0=s.y,x1=s.x+s.w,y1=s.y+s.h;
      if(drag.h.includes('w'))x0=Math.min(Math.max(0,s.x+dx),x1-mn);if(drag.h.includes('e'))x1=Math.max(Math.min(W,s.x+s.w+dx),x0+mn);
      if(drag.h.includes('n'))y0=Math.min(Math.max(0,s.y+dy),y1-mn);if(drag.h.includes('s'))y1=Math.max(Math.min(H,s.y+s.h+dy),y0+mn);
      crop.st={x:x0,y:y0,w:x1-x0,h:y1-y0}}
    paintCrop()});
  const end=()=>{drag=null};stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
  o.addEventListener('click',onCropClick);
}
async function onCropClick(e){
  const b=e.target.closest('[data-crop]');if(!b||!crop)return;const a=b.dataset.crop;
  if(a==='close')closeCropper();
  if(a==='rotate'){crop.work=rotC(crop.work);crop.rot=(crop.rot+1)%4;crop.guesses=[];layoutCrop(null)}
  if(a==='all'){crop.st={x:0,y:0,w:crop.cw,h:crop.ch};paintCrop()}
  if(a==='guess')await guessCrop();
  if(a==='ok')await finishCrop()}
async function finishCrop(){
  const k=crop,s=k.st,sc=k.scale,sx=s.x/sc,sy=s.y/sc,sw=s.w/sc,sh=s.h/sc;
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(sw));c.height=Math.max(1,Math.round(sh));c.getContext('2d').drawImage(k.work,sx,sy,sw,sh,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.92));
  const box=[sy/k.work.height*1000,sx/k.work.width*1000,(sy+sh)/k.work.height*1000,(sx+sw)/k.work.width*1000].map(Math.round);
  closeCropper();await k.onDone(blob,{photo:k.srcId,box,rot:k.rot})}
async function guessCrop(){
  if(crop.guesses.length){crop.gi=(crop.gi+1)%crop.guesses.length;setCropBox(crop.guesses[crop.gi]);cropMsg(`Schéma ${crop.gi+1} sur ${crop.guesses.length}. Vérifie le cadre, ou touche encore « Deviner » pour le suivant.`);return}
  if(!caps.sample||!caps.img){cropMsg("L'IA n'est pas disponible ici : entoure le schéma avec ton doigt.");return}
  cropMsg("L'IA cherche les schémas…");const k=crop;
  try{
    const blob=await new Promise(r=>k.work.toBlob(r,'image/jpeg',.85));
    const r=await caps.sample.json(`Cette photo vient du cahier ou du tableau d'un élève. Repère chaque schéma, circuit, dessin, graphique ou figure (PAS le texte seul). Pour chacun, donne un cadre [ymin, xmin, ymax, xmax] en coordonnées de 0 à 1000 qui entoure TOUT le schéma avec ses légendes, valeurs, flèches et axes, avec une marge confortable. Classe-les de haut en bas puis de gauche à droite. Réponds uniquement en JSON : {"schemas":[{"box":[ymin,xmin,ymax,xmax],"description":"..."}]}`,{images:[blob],cache:false});
    if(crop!==k)return;
    const g=(r&&r.schemas||[]).map(x=>x&&x.box).filter(validBox).map(padBox);
    if(!g.length){cropMsg("Je n'ai pas trouvé de schéma. Entoure-le toi-même avec ton doigt.");return}
    crop.guesses=g;crop.gi=0;setCropBox(g[0]);cropMsg(`J'ai trouvé ${g.length} schéma${g.length>1?'s':''}. Vérifie le cadre${g.length>1?', ou touche encore « Deviner » pour le suivant':''}.`);
  }catch(e){if(crop===k)cropMsg(e&&e.code?aiErr(e):"La recherche a échoué. Entoure le schéma toi-même.")}}

/* --- redessin propre par l'IA (essai, l'original est gardé) --- */
async function svgToPng(str){
  const doc=new DOMParser().parseFromString(String(str||''),'image/svg+xml'),root=doc.documentElement;
  if(!root||root.nodeName!=='svg'||doc.querySelector('parsererror'))throw new Error('svg');
  root.querySelectorAll('script,foreignObject,image,use,style,iframe,a').forEach(n=>n.remove());
  [root,...root.querySelectorAll('*')].forEach(n=>[...n.attributes].forEach(a=>{if(/^on/i.test(a.name)||/href/i.test(a.name))n.removeAttribute(a.name)}));
  if(!root.getAttribute('xmlns'))root.setAttribute('xmlns','http://www.w3.org/2000/svg');
  const vb=(root.getAttribute('viewBox')||'').split(/[\s,]+/).map(Number);let w=vb[2],h=vb[3];
  if(!(w>0&&h>0)){w=parseFloat(root.getAttribute('width'))||600;h=parseFloat(root.getAttribute('height'))||400;root.setAttribute('viewBox',`0 0 ${w} ${h}`)}
  root.setAttribute('width',w);root.setAttribute('height',h);
  const img=await loadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(root)));
  const k=Math.min(2,1400/w),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,'image/png'))}
async function redrawSchema(it){
  if(!caps.sample||!caps.img){alert("L'IA n'est pas disponible ici.");return}
  toast("L'IA redessine le schéma…");
  try{
    const blob=await (await fetch(photoUrl(it.id))).blob();
    const r=await caps.sample.json(`Redessine proprement ce schéma (circuit électronique, figure ou graphique) en SVG : traits noirs nets d'épaisseur 2, fond transparent, symboles normalisés (résistance = rectangle, condensateur = deux traits parallèles, etc.), fils droits à angle droit, étiquettes lisibles (police sans-serif 14 à 16 px) avec EXACTEMENT les mêmes noms et valeurs que le dessin. Respecte les liaisons, n'invente rien. viewBox obligatoire (ex. 0 0 600 400), aucun script, aucune image externe. Réponds uniquement en JSON : {"svg":"<svg ...>...</svg>"}`,{images:[blob],cache:false});
    const png=await svgToPng(r&&r.svg);if(!png)throw new Error('png');
    const url=URL.createObjectURL(png),o=document.createElement('div');o.className='pickview';
    o.innerHTML=`<div class="crophead"><b>Compare</b><button class="iconbtn" data-cmp="no" aria-label="Fermer">✕</button></div><p class="cropmsg">L'IA a redessiné ton schéma. Vérifie que les liaisons et les valeurs sont justes avant de le garder.</p>
      <div class="cmpgrid"><figure><figcaption>Original</figcaption><img src="${photoUrl(it.id)}" alt="Original"></figure><figure><figcaption>Redessiné</figcaption><img src="${url}" alt="Redessiné"></figure></div>
      <div class="cropbtns"><button class="btn ghost" data-cmp="no">Garder l'original</button><button class="btn" data-cmp="yes">Utiliser le redessin</button></div>`;
    o.addEventListener('click',async e=>{const b=e.target.closest('[data-cmp]');if(!b)return;o.remove();
      if(b.dataset.cmp==='yes'){const prev=(draft.schemaSrc||{})[it.id]||{};const nid=await uploadSchema(png,{...prev,redrawn:true});if(nid){syncDraftFromDom();draft.text=draft.text.replace(it.tok,`[[img:${nid}]]`);render();toast('Schéma remplacé')}}});
    document.body.appendChild(o);
  }catch(e){alert(e&&e.code?aiErr(e):"Le redessin n'a pas fonctionné cette fois. Ton schéma d'origine est gardé.")}}

/* --- actions --- */
main.addEventListener('click',async e=>{
  const sm=e.target.closest('[data-smode]');
  if(sm){syncDraftFromDom();state.settings.schemaMode=sm.dataset.smode;save();render();return}
  const b=e.target.closest('[data-act^="sc-"]');if(!b||!draft)return;
  const a=b.dataset.act;syncDraftFromDom();
  const it=schemaList(draft.text)[+b.dataset.i];
  if(a==='sc-new'){
    const id=await pickPhoto(draft.photos);if(!id)return;
    const ta=document.getElementById('draftText'),pos=ta?ta.selectionStart:draft.text.length;
    openCropper({srcId:id,onDone:async(blob,meta)=>{const nid=await uploadSchema(blob,meta);if(!nid)return;syncDraftFromDom();const p=Math.min(pos,draft.text.length);draft.text=draft.text.slice(0,p)+`\n[[img:${nid}]]\n`+draft.text.slice(p);render();toast('Schéma ajouté')}})}
  if(a==='sc-adjust'&&it){
    const src=(draft.schemaSrc||{})[it.id]||null;
    let pid=it.kind==='todo'?it.id:(src&&draft.photos.includes(src.photo)?src.photo:null);
    if(!pid)pid=await pickPhoto(draft.photos);if(!pid)return;
    openCropper({srcId:pid,box:src&&src.photo===pid?src.box:null,rot:src&&src.photo===pid?(src.rot||0):0,onDone:async(blob,meta)=>{
      const nid=await uploadSchema(blob,meta);if(!nid)return;syncDraftFromDom();
      const at=draft.text.indexOf(it.tok);if(at<0){render();return}
      let t=draft.text.slice(0,at)+`[[img:${nid}]]`+draft.text.slice(at+it.tok.length);
      if(it.kind==='todo'){const tail=t.slice(at,at+260).replace('*Schéma à découper :','*Schéma :');t=t.slice(0,at)+tail+t.slice(at+260)}
      draft.text=t;render();toast('Schéma mis à jour')}})}
  if(a==='sc-del'&&it){draft.text=draft.text.replace(new RegExp('\\n?'+escRe(it.tok)+'[ \\t]*\\n?(?:\\*Schéma[^\\n]*\\*[ \\t]*\\n?)?'),'\n');render()}
  if(a==='sc-redraw'&&it&&it.kind==='img')redrawSchema(it)});

const LX_NEW=['fey','oq','cz','tf','ws','ana','cmp'];
const LX_GROUPS=[
 ['Comprendre',[['prof','cap','Prof particulier',"Il t'enseigne pas à pas"],['fey','edit','Explique avec tes mots','Méthode de Feynman'],['ws','stairs','Pas à pas','Exemple résolu puis exercice jumeau'],['ana','sparkles','Analogies et astuces','Des images pour retenir'],['cmp','columns','Comparer','Ne plus confondre deux notions']]],

const lxNorm=t=>String(t==null?'':t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const lxOk=(ans,exp)=>{const a=lxNorm(ans);return a!==''&&String(exp).split('|').some(e=>lxNorm(e)===a)};
const lxClamp=(v,a,b)=>Math.max(a,Math.min(b,Math.round(+v||0)));

async function lxGen(kind,msg,prompt,apply){

    return `${h}<div class="row" style="align-items:center;gap:14px;margin-bottom:12px"><div class="avg" style="color:${col}">${r.note}/10</div><div class="grow"><b>${esc(f.concept)}</b><div class="meta">${r.note>=7?"Tu as bien compris l'essentiel.":r.note>=4?'Bonne base, quelques points à corriger.':'Pas encore solide : reprends avec les corrections.'}</div></div></div>
    ${r.juste.length?`<h4 class="lxs ok">Ce qui est juste</h4><ul class="lxl">${r.juste.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    ${r.erreurs.length?`<h4 class="lxs ko">À corriger</h4><ul class="lxl">${r.erreurs.map(x=>`<li><s>${esc(x.dit||'')}</s><br><b>${esc(x.correction||'')}</b></li>`).join('')}</ul>`:''}
    ${r.manques.length?`<h4 class="lxs">Tu as oublié</h4><ul class="lxl">${r.manques.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    ${r.version?`<h4 class="lxs">Une explication modèle</h4><p class="lxq">${esc(r.version)}</p>`:''}
    ${r.relance?`<h4 class="lxs">Pour aller plus loin</h4><p style="margin:0">${esc(r.relance)}</p>`:''}
    <div class="row" style="flex-wrap:wrap;margin-top:14px"><button class="btn" data-act="lx-fey-again">Réécrire avec les corrections</button><button class="btn ghost" data-act="lx-fey-new">Autre notion</button></div>`}
  return `${h}
    <div class="editor"><label>Notion à expliquer<input id="feyConcept" value="${esc(f.concept)}" placeholder="Ex. la loi d'Ohm, le transistor, la photosynthèse…"></label></div>

    ${f.ideas?`<div class="sugg">${f.ideas.map(x=>`<button type="button" data-act="lx-fey-pick" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>`:''}
    <div class="editor" style="margin-top:10px"><label>Explique-la comme à un enfant de 10 ans, sans regarder ton cours<textarea id="feyText" rows="7" placeholder="Écris avec tes mots. Astuce : le micro du clavier de ton téléphone marche très bien.">${esc(f.text)}</textarea></label></div>
    <button class="btn" style="margin-top:10px" data-act="lx-fey-go">Voir ce que j'ai compris</button>`}

    ${o.res.conseil?`<p class="lxq">${esc(o.res.conseil)}</p>`:''}

/* --- 3. Texte à trous --- */
function lxCloze(txt){const parts=[],re=/\{\{([^}]+)\}\}/g;let last=0,m,k=0;while((m=re.exec(txt))){parts.push({t:txt.slice(last,m.index)});parts.push({k:k++,a:m[1].trim()});last=re.lastIndex}parts.push({t:txt.slice(last)});return parts}
function vCz(){
  const c=LX.cz,h=lxHead('Texte à trous');if(learn.busy)return h+lxBusy();
  if(!c.d)return h+''+lxIntro("L'IA écrit un résumé de ton cours en cachant les mots-clés. Tu les retrouves de tête, sans regarder.","Créer mon texte à trous",'lx-cz-start');
  const parts=lxCloze(c.d.texte);
  const body=parts.map(p=>{
    if(p.t!==undefined)return esc(p.t).replace(/\n/g,'<br>');
    const v=c.vals[p.k]||'',first=p.a.split('|')[0],st=c.checked?(lxOk(v,p.a)?' ok':' ko'):'';
    return `<input class="cloze${st}" data-cz="${p.k}" value="${esc(v)}" ${c.checked?'readonly':''} placeholder="${c.hint?esc(first[0]+'…'):''}" style="width:${Math.max(6,first.length+3)}ch" autocomplete="off" autocapitalize="none" spellcheck="false">${c.checked&&!lxOk(v,p.a)?`<span class="czfix">${esc(first)}</span>`:''}`}).join('');
  const n=parts.filter(p=>p.k!==undefined).length;
  return `${h}<h4 class="lxs" style="margin-top:0">${esc(c.d.titre||'')}</h4><div class="czbox">${body}</div>
    ${c.checked?`<div class="info" style="margin-top:12px"><b>${c.score} / ${n}</b> mots retrouvés. ${c.score===n?'Parfait !':c.score>=n*.6?'Pas mal, relis les mots en vert à côté de tes erreurs.':'Relis le cours puis recommence.'}</div><div class="row" style="flex-wrap:wrap;margin-top:10px"><button class="btn" data-act="lx-cz-again">Recommencer</button><button class="btn ghost" data-act="lx-cz-start">Nouveau texte</button></div>`
    :`<div class="row" style="flex-wrap:wrap;margin-top:12px"><button class="btn" data-act="lx-cz-check">Vérifier</button><button class="btn ghost" data-act="lx-cz-hint">${c.hint?'Cacher les indices':'Indice : première lettre'}</button></div>`}`}

/* --- 4. Vrai ou faux piégeux --- */
function vTf(){
  const t=LX.tf,h=lxHead('Vrai ou faux piégeux');if(learn.busy)return h+lxBusy();
  if(!t.items)return h+''+lxIntro("8 affirmations, dont la moitié sont fausses avec une erreur typique. À toi de les repérer.","Commencer",'lx-tf-start');
  const n=t.items.length;
  if(t.i>=n){const ok=t.items.filter((it,i)=>t.picks[i]===it.vrai).length,bad=t.items.map((it,i)=>({it,i})).filter(x=>t.picks[x.i]!==x.it.vrai);
    return `${h}<div class="row" style="align-items:center;gap:14px;margin-bottom:10px"><div class="avg">${ok}/${n}</div><div class="grow"><div class="meta">${ok===n?'Aucun piège ne t\'a échappé.':ok>=n*.7?'Bien, regarde les pièges ratés.':'Beaucoup de pièges : relis le cours puis recommence.'}</div></div></div>
    ${bad.length?`<h4 class="lxs ko">Les pièges ratés</h4><ul class="list">${bad.map(x=>`<li class="item" style="flex-direction:column;align-items:stretch"><b>${esc(x.it.enonce)}</b><div class="meta">C'était ${x.it.vrai?'vrai':'faux'}. ${esc(x.it.explication||'')}</div></li>`).join('')}</ul>`:''}
    <div class="row" style="margin-top:12px"><button class="btn" data-act="lx-tf-start">Nouvelles affirmations</button></div>`}
  const it=t.items[t.i],p=t.picks[t.i];
  return `${h}<div class="bar" style="margin-bottom:10px"><i style="width:${t.i/n*100}%;background:var(--copper)"></i></div><p class="meta" style="margin:0">Affirmation ${t.i+1} sur ${n}</p><p class="lxq" style="font-size:1.12rem;margin:8px 0 14px">${esc(it.enonce)}</p>
    ${p===undefined?`<div class="tfbtns"><button class="btn" data-act="lx-tf" data-v="1">Vrai</button><button class="btn ghost" data-act="lx-tf" data-v="0">Faux</button></div>`
    :`<div class="info"><b>${p===it.vrai?'Bien vu.':'Piège !'}</b> C'était ${it.vrai?'vrai':'faux'}. ${esc(it.explication||'')}</div><button class="btn" style="margin-top:10px" data-act="lx-tf-next">${t.i+1<n?'Suivante':'Voir mon score'}</button>`}`}

/* --- 5. Pas à pas : exemple résolu puis exercice jumeau --- */
function vWs(){
  const w=LX.ws,h=lxHead('Pas à pas');if(learn.busy)return h+lxBusy();
  if(!w.d)return h+''+lxIntro("L'IA résout un exercice typique de ton cours étape par étape en expliquant pourquoi. Ensuite, c'est à toi sur un exercice jumeau, avec des indices si tu bloques.","Voir un exemple",'lx-ws-start');
  const ex=w.d.exemple,tw=w.d.jumeau,steps=ex.etapes,shown=Math.min(w.step,steps.length);
  let html=`${h}<h4 class="lxs" style="margin-top:0">Un exemple résolu</h4><p class="lxq">${esc(ex.enonce)}</p><ol class="lxo">${steps.slice(0,shown).map(s=>`<li><b>${esc(s.faire)}</b>${s.pourquoi?`<div class="meta">Pourquoi : ${esc(s.pourquoi)}</div>`:''}</li>`).join('')}</ol>`;
  if(shown<steps.length)return html+`<button class="btn" data-act="lx-ws-step">Étape suivante (${shown}/${steps.length})</button>`;
  html+=`<p class="info"><b>Résultat :</b> ${esc(ex.resultat||'')}</p><h4 class="lxs">À toi maintenant</h4><p class="lxq">${esc(tw.enonce)}</p>
    <div class="editor"><textarea id="wsAtt" rows="6" placeholder="Écris ta résolution…">${esc(w.att)}</textarea></div>
    ${w.hint?`<ul class="lxl" style="margin-top:8px">${tw.indices.slice(0,w.hint).map((x,i)=>`<li><b>Indice ${i+1} :</b> ${esc(x)}</li>`).join('')}</ul>`:''}
    <div class="row" style="flex-wrap:wrap;margin-top:10px">${w.hint<tw.indices.length?`<button class="btn ghost" data-act="lx-ws-hint">Indice ${w.hint+1}</button>`:''}<button class="btn" data-act="lx-ws-check">Corriger ma réponse</button><button class="btn ghost" data-act="lx-ws-sol">${w.sol?'Cacher':'Voir'} la solution</button></div>
    ${w.fb?`<div class="info" style="margin-top:12px"><b>${w.fb.verdict==='juste'?'C\'est juste.':w.fb.verdict==='partiel'?'En partie juste.':'Pas tout à fait.'}</b> ${esc(w.fb.retour||'')}${w.fb.conseil?`<br><span class="meta">${esc(w.fb.conseil)}</span>`:''}</div>`:''}

      await lxGen('fey','',`L'élève doit expliquer la notion « ${f.concept} » avec ses propres mots, comme à un enfant de 10 ans, sans regarder son cours. Voici son explication :\n"""${f.text.slice(0,4000)}"""\nCompare avec le cours (ou le programme). Sois bienveillant mais exact. Réponds uniquement en JSON : {"note":entier de 0 à 10,"juste":["ce qui est correct et bien dit"],"erreurs":[{"dit":"ce que l'élève a dit de faux ou d'imprécis","correction":"la bonne version"}],"manques":["idée importante oubliée"],"version_simple":"une explication modèle simple en 4 à 6 phrases avec une image de la vie courante","relance":"une question pour aller plus loin"}`,r=>{

      await lxGen('oq-eval','L\'IA corrige tes réponses…',`Corrige ces réponses d'élève. Pour chaque question, note 0, 1 ou 2 (2 = juste et complet, 1 = en partie, 0 = faux ou vide), donne un retour court et bienveillant, et rappelle ce qu'il faut retenir. QUESTIONS ET RÉPONSES : ${JSON.stringify(items)}\nRéponds uniquement en JSON : {"resultats":[{"note":0,"retour":"...","a_retenir":"..."}],"conseil":"un conseil global en une phrase"}`,r=>{

        const total=res.slice(0,o.qs.length).reduce((s,x)=>s+x.note,0);o.res={items:res,total,conseil:String(r.conseil||'')};lxRecord('open',total,o.qs.length*2)});return}
    /* Texte à trous */
    case 'lx-cz-start':await lxGen('cz','',"Écris un résumé clair du cours en un texte suivi de 120 à 180 mots (pas de liste). Puis cache les 8 à 12 mots ou expressions les plus importants (termes clés, valeurs, définitions) en les entourant de doubles accolades, par exemple {{résistance}}. Si une réponse peut s'écrire de plusieurs façons, sépare-les avec | par exemple {{ampère|ampères}}. Réponds uniquement en JSON : {\"titre\":\"...\",\"texte\":\"...\"}",r=>{const t=String(r.texte||'');if(lxCloze(t).filter(p=>p.k!==undefined).length<3)throw 0;LX.cz={d:{titre:String(r.titre||''),texte:t},vals:{},checked:false,hint:false,score:null,rec:false}});return;

      if(!c.rec){c.rec=true;lxRecord('cloze',c.score,blanks.length)}paintLearn();return}
    /* Vrai ou faux */
    case 'lx-tf-start':await lxGen('tf','',"Crée 8 affirmations vrai ou faux sur ce cours, dont 4 fausses. Les fausses contiennent une erreur piège typique (confusion fréquente, inversion, mauvaise unité) mais restent plausibles. Mélange l'ordre. Pour chacune, une explication courte (1 à 2 phrases) qui corrige. Réponds uniquement en JSON : {\"items\":[{\"enonce\":\"...\",\"vrai\":true,\"explication\":\"...\"}]}",r=>{const items=lxA(r.items).filter(x=>x&&x.enonce).map(x=>({enonce:String(x.enonce),vrai:x.vrai===true||x.vrai==='true',explication:String(x.explication||'')}));if(items.length<3)throw 0;LX.tf={items,i:0,picks:[],rec:false}});return;
    case 'lx-tf':LX.tf.picks[LX.tf.i]=b.dataset.v==='1';paintLearn();return;

    /* Pas à pas */
    case 'lx-ws-start':await lxGen('ws','',"À partir du cours, choisis un type d'exercice typique. 1) Résous un EXEMPLE complet étape par étape : énoncé, étapes numérotées (chaque étape = ce qu'on fait + POURQUOI, en une ou deux phrases), résultat final. 2) Invente un EXERCICE JUMEAU (même méthode, autres valeurs ou autre situation) avec 3 indices progressifs (le 1er très discret, le 3e presque la solution) et la solution complète rédigée. Si la matière est littéraire (langue, histoire…), fais une analyse ou une rédaction guidée. Réponds uniquement en JSON : {\"exemple\":{\"enonce\":\"...\",\"etapes\":[{\"faire\":\"...\",\"pourquoi\":\"...\"}],\"resultat\":\"...\"},\"jumeau\":{\"enonce\":\"...\",\"indices\":[\"...\",\"...\",\"...\"],\"solution\":\"...\"}}",r=>{
        const ex=r.exemple||{},tw=r.jumeau||{};const etapes=lxA(ex.etapes).map(s=>typeof s==='string'?{faire:s,pourquoi:''}:{faire:String(s.faire||''),pourquoi:String(s.pourquoi||'')}).filter(s=>s.faire);

    case 'lx-ws-check':{const w=LX.ws,tw=w.d.jumeau;if(w.att.trim().length<3){learn.err='Écris d\'abord ta réponse.';paintLearn();return}
      await lxGen('ws-check','L\'IA corrige ta réponse…',`Exercice : ${tw.enonce}\nSolution attendue : ${tw.solution}\nRéponse de l'élève : ${w.att.slice(0,2000)}\nDis si c'est juste, ce qui est bien, l'erreur éventuelle et comment la corriger, sans donner toute la solution si l'élève a presque réussi. Réponds uniquement en JSON : {"verdict":"juste ou partiel ou faux","retour":"...","conseil":"..."}`,r=>{w.fb={verdict:['juste','partiel','faux'].includes(r.verdict)?r.verdict:'partiel',retour:String(r.retour||''),conseil:String(r.conseil||'')}});return}

    case 'lx-ana-say':{stopSpeech();speak(LX.ana.items.map(x=>`${x.notion}. ${x.analogie}. À retenir : ${x.astuce}.`).join(' '),{rate:learn.rate});return}
    case 'lx-ana-save':{const c=learn.sel.map(id=>courses.find(x=>x.id===id)).find(Boolean);
      const text=LX.ana.items.map(x=>`## ${x.notion}\n- Image : ${x.analogie||''}\n- À retenir : ${x.astuce||''}${x.piege?`\n- Piège : ${x.piege}`:''}`).join('\n\n');
      await saveCourse({id:uid(),title:'Astuces mémoire : '+(c?c.title:learn.topic.trim()||'mon cours'),subjectId:c?c.subjectId:(state.subjects[0]||{}).id,date:iso(today()),text,photos:[],source:'ia',created:Date.now()});LX.ana.saved=true;toast('Astuces enregistrées dans Mes cours');paintLearn();return}
    /* Comparer */
    case 'lx-cmp-go':case 'lx-cmp-auto':{const c=LX.cmp,A=a==='lx-cmp-go'?c.a.trim():'',B=a==='lx-cmp-go'?c.b.trim():'';
      if(a==='lx-cmp-go'&&(!A||!B)){learn.err='Écris les deux notions, ou touche « Laisser l\'IA choisir ».';paintLearn();return}
      await lxGen('cmp','',`${A&&B?`Compare « ${A} » et « ${B} ».`:"Choisis deux notions du cours qu'on confond souvent et compare-les."} Construis un tableau de 4 à 6 critères. Réponds uniquement en JSON : {"titre":"A contre B","a":"nom de A","b":"nom de B","lignes":[{"critere":"...","a":"...","b":"..."}],"difference":"la différence essentielle en une phrase","astuce":"comment ne plus les confondre"}`,r=>{const lignes=lxA(r.lignes).filter(x=>x&&x.critere);if(lignes.length<2)throw 0;LX.cmp.d={titre:String(r.titre||''),a:String(r.a||A||'A'),b:String(r.b||B||'B'),lignes,difference:String(r.difference||''),astuce:String(r.astuce||'')}});return}

/* ================= Équipe d'IA : binôme, missions, surveillance mutuelle, relais ================= */
const MISSIONS={
 devoir:{titre:'Corriger le devoir',objectif:"Corriger ce devoir sans aucune erreur de calcul, de méthode ou de notation",criteres:"chaque réponse est vérifiée, la démarche est juste, la note correspond au barème",chef:'duo'},
 exam:{titre:"Corriger l'examen blanc",objectif:"Corriger cette copie d'examen avec rigueur et justice",criteres:"le barème est respecté, les calculs sont exacts, la note sur 20 est justifiée",chef:'duo'},
 question:{titre:"Répondre à l'élève",objectif:"Donner une réponse exacte, claire et adaptée au niveau de l'élève",criteres:"aucune erreur factuelle, explication simple, exemples adaptés",chef:'main'},
 generic:{titre:'Mission',objectif:"Donner la meilleure réponse possible à l'élève",criteres:"exacte, claire, complète",chef:'main'}
};
function parseLoose(t){t=String(t||'').replace(/```json|```/g,'');const i=t.indexOf('{'),j=t.lastIndexOf('}');if(i<0||j<=i)return null;try{return JSON.parse(t.slice(i,j+1))}catch(e){return null}}
const shortErr=e=>{const c=e&&e.code;return c==='bad_key'?'clé refusée':c==='rate_limited'?'limite atteinte':c==='offline'?'hors connexion':c==='bad_model'?'modèle inconnu':c==='overloaded'?'serveur saturé':"n'a pas répondu"};
/* --- classement : missions réussies / ratées, banc après 3 échecs d'affilée --- */
const aiStats=()=>aiCfg().stats||{};
const benched=id=>{const s=aiStats()[id];return !!(s&&s.bench&&s.bench>Date.now())};
function agentResult(id,ok){
  const c=aiCfg();c.stats=c.stats||{};const s=c.stats[id]=c.stats[id]||{ok:0,ko:0,streak:0,bench:0};
  if(ok){s.ok++;s.streak=0}else{s.ko++;s.streak++;if(id!=='main'&&s.streak>=3)s.bench=Date.now()+6*3600e3}
  localStorage.setItem(CFG_KEY,JSON.stringify(c))}
function duoAgent(){const ex=extrasOn();return ex.find(a=>a.role==='duo')||ex[0]||null}
function dnIA(name,i,role){
  if(!maskOn())return name;
  if(role==='main'||(role===undefined&&i===0))return 'IA principale';
  if(role==='duo')return 'Spécialiste devoirs';
  if(/\(relecture\)$/.test(String(name)))return 'Relecture';
  return 'IA '+(i+1)}
const whoAI=p=>maskOn()?(p.role==='main'?"L'IA principale":p.role==='duo'?'Le spécialiste devoirs':'Une IA'):p.label;

/* --- une mission d'équipe : travail, relecture croisée, décision du chef, vérification, bilan --- */
async function teamRun({sys,task,img,onStep,mission}){
  const M=MISSIONS[mission]||MISSIONS.generic,step=onStep||(()=>{});
  const duo=duoAgent(),agents=extrasOn();
  const P=[{id:'main',label:'Gemini',role:'main'}];
  if(duo)P.push({id:duo.id,label:duo.label,role:'duo',agent:duo});
  agents.filter(a=>!duo||a.id!==duo.id).forEach(a=>P.push({id:a.id,label:a.label,role:'renfort',agent:a}));
  const briefing=`MISSION : ${M.objectif}.\nCRITÈRES DE RÉUSSITE : ${M.criteres}.\nTu fais partie d'une équipe d'IA : chaque membre est relu par un collègue, et une mission ratée est enregistrée au classement. Réussis la tienne.\n\n`;
  const ask=(p,prompt,opts,json)=>p.role==='main'?geminiCall(sys+'\n\n'+prompt,opts||{},!!json):callAgent(p.agent,[{role:'system',content:sys},{role:'user',content:prompt}]);
  step(`👥 ${P.length} IA reçoivent la mission et travaillent chacune de leur côté${maskOn()?'':' : '+P.map(p=>p.label).join(', ')}…`);
  /* 1. travail en parallèle */
  const res=await Promise.allSettled(P.map(p=>ask(p,briefing+task,p.role==='main'&&img?{images:[img]}:{})));
  P.forEach((p,i)=>{const r=res[i];p.ok=r.status==='fulfilled'&&String(r.value.text||'').trim().length>=5;p.text=p.ok?String(r.value.text).trim():'';p.err=p.ok?'':(r.status==='rejected'?shortErr(r.reason):"réponse vide")});
  const okList=P.filter(p=>p.ok);
  if(!okList.length){P.forEach(p=>agentResult(p.id,false));throw (res.find(r=>r.status==='rejected')||{}).reason||aiError('upstream')}
  /* 2. relecture croisée : chacun surveille son voisin */
  const reviews={};
  if(okList.length>=2){
    step(maskOn()?"🔍 Chaque IA relit le travail de son voisin pour chercher des erreurs…":`🔍 Chaque IA relit le travail de son voisin : ${okList.map((p,i)=>`${p.label} relit ${okList[(i+1)%okList.length].label}`).join(', ')}…`);
    await Promise.all(okList.map(async(rv,i)=>{
      const au=okList[(i+1)%okList.length];
      const prompt=`${briefing}RELECTURE. Voici la tâche :\n${task.slice(0,6000)}\n\nVoici le travail d'un collègue à vérifier :\n${au.text.slice(0,8000)}\n\nCherche les erreurs réelles (faits, calculs, méthode, oublis, hors-sujet). Réponds uniquement en JSON : {"note":nombre de 0 à 10,"erreurs":[{"ou":"question ou passage","probleme":"...","correction":"...","grave":true ou false}]} ("grave" = l'erreur change le résultat final).`;
      try{const raw=(await ask(rv,prompt,{},true)).text;reviews[au.id]={by:rv,j:parseLoose(raw)}}
      catch(e){rv.revErr=true;reviews[au.id]={by:rv,j:null}}}));
  }
  P.forEach(p=>{
    if(!p.ok){p.good=false;return}
    const j=(reviews[p.id]||{}).j;
    p.erreurs=j?lxA(j.erreurs).filter(x=>x&&typeof x==='object'):[];
    p.graves=p.erreurs.filter(x=>x.grave===true||x.grave==='true').length;
    p.note=j&&isFinite(parseFloat(j.note))?Math.max(0,Math.min(10,parseFloat(j.note))):null;

    const dossier=okList.map((p,i)=>{const r=reviews[p.id];return `### Travail du membre ${i+1}\n${p.text.slice(0,7000)}\n#### Relecture par un collègue : ${r&&r.j?`note ${p.note===null?'?':p.note}/10 ; erreurs signalées : ${JSON.stringify(p.erreurs).slice(0,1500)}`:'aucune relecture exploitable'}`}).join('\n\n');

  const checker=okList.find(p=>p!==chef);

    step(`✅ ${whoAI(checker)} vérifie une dernière fois la version finale…`);
    try{
      const vp=`${briefing}VÉRIFICATION FINALE. Tâche :\n${task.slice(0,5000)}\n\nVersion finale proposée :\n${finalText.slice(0,9000)}\n\nReste-t-il une erreur réelle ? Réponds uniquement en JSON : {"ok":true ou false,"erreurs":[{"ou":"...","probleme":"...","correction":"..."}]}`;

      if(j&&j.ok===false&&lxA(j.erreurs).length){
        step("✍️ L'erreur restante est corrigée dans la version finale…");
        const fp=`${briefing}Version finale :\n${finalText}\n\nUn collègue signale encore : ${JSON.stringify(j.erreurs).slice(0,2500)}\nVérifie, corrige seulement ce qui est faux et réécris la version finale complète.`;
        try{const t=String((await ask(chef,fp)).text||'').trim();if(t)finalText=t}catch(e){}
      }

  P.forEach(p=>agentResult(p.id,p.ok&&p.good!==false));
  const okCount=P.filter(p=>p.ok&&p.good!==false).length;
  const success=!!finalText&&okCount>=Math.ceil(P.length/2);
  const report={mission:M.titre,objectif:M.objectif,success,relais:!P[0].ok,
    agents:P.map(p=>({id:p.id,label:p.label,role:p.role,chef:p===chef,ok:p.ok&&p.good!==false,note:p.note==null?null:p.note,graves:p.graves||0,

  const team=P.map(p=>({ia:p.label,role:p.role,ok:p.ok,text:p.ok?p.text:'⚠️ '+(p.err||'')}));

function sprintQ(r){

    const o=mkOpts(fmtSI(c,'A'),[fmtSI(Rr/U,'A'),fmtSI(U*Rr,'A'),fmtSI(c*10,'A'),fmtSI(c/10,'A')],R);return{q:`Une résistance de ${fmtSI(Rr,'Ω')} est alimentée sous ${U} V. Quel courant la traverse ?`,...o,meta:{t,U,R:Rr}}}

  if(t==='rescode'){const d1=1+Math.floor(R()*9),d2=Math.floor(R()*10),m=pick(['noir','marron','rouge','orange','jaune','vert'],R),bands=[RC_COL[d1][0],RC_COL[d2][0],m,'or'],dec=rcDecode(bands),val=dec.ohms,c=fmtSI(val,'Ω')+' ±5 %';

  if(t==='logic'){const g=pick(['ET','OU','NON-ET','NON-OU','OU exclusif'],R),a=R()<.5?0:1,b=R()<.5?0:1,out=String(GATES[g][0](a,b));

const PAIR_DECKS={
 unites:{nom:'Unités',pairs:[['Tension','Volt (V)'],['Courant','Ampère (A)'],['Résistance','Ohm (Ω)'],['Puissance','Watt (W)'],['Capacité','Farad (F)'],['Inductance','Henry (H)'],['Fréquence','Hertz (Hz)'],['Charge','Coulomb (C)']]},

function pairsNew(key,r){const d=PAIR_DECKS[key],ps=shuf(d.pairs,r).slice(0,6),cards=[];ps.forEach((p,i)=>{cards.push({pid:i,label:p[0]});cards.push({pid:i,label:p[1]})});
  return{deck:key,cards:shuf(cards,r),open:[],matched:[],moves:0,done:false,stars:0}}
function pairsPick(g,i){
  if(g.done||g.open.length>=2||g.open.includes(i)||g.matched.includes(i))return 'ignore';
  g.open.push(i);if(g.open.length<2)return 'first';
  g.moves++;const [a,b]=g.open;
  if(g.cards[a].pid===g.cards[b].pid){g.matched.push(a,b);g.open=[];if(g.matched.length===g.cards.length){g.done=true;g.stars=g.moves<=8?3:g.moves<=11?2:1;return 'done'}return 'match'}
  return 'miss'}

function vInstall(){
  const me=instPlatform(),native=instNative(),sa=instStandalone(),pw=window.__pwaPrompt;
  const first=INST_STEPS[me]?me:'android',rest=['android','ios','windows','mac','linux'].filter(x=>x!==first);
  const ver=typeof APP_VERSION!=='undefined'?APP_VERSION:'';
  const dl=k=>k==='android'||k==='windows'?`<a class="btn" data-inst="dl-${k}" href="${esc(dlUrl())}" target="_blank" rel="noopener">${iconSvg('download')} Télécharger pour ${k==='android'?'Android':'Windows'}</a>`:`<a class="btn" data-inst="web-${k}" href="${esc(webUrl())}" target="_blank" rel="noopener">${iconSvg('globe')} Ouvrir la version web</a>`;
  const block=k=>{const d=INST_STEPS[k];return `<ol class="lxo">${d.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${d.alt?`<p class="meta" style="margin:0 0 10px">${esc(d.alt)}</p>`:''}<div class="row" style="flex-wrap:wrap;gap:8px">${k==='ios'?`<a class="btn" data-inst="web-ios" href="${esc(webUrl())}" target="_blank" rel="noopener">${iconSvg('globe')} Ouvrir la version web</a>`:dl(k)}</div>`};
  return `<section class="panel"><h3>${native?"Tu utilises l'appli installée":sa?"Tu utilises l'appli installée depuis le navigateur":"Installer l'appli"}</h3>
    <p class="empty" style="margin-bottom:10px">${native||sa?`Version ${esc(ver||'web')}. Voici comment l'installer sur d'autres appareils.`:"Choisis ton appareil. Les fichiers Android et Windows se téléchargent sur la page des versions (GitHub). La version web s'ouvre dans le navigateur et marche aussi sur iPhone."}</p>
    <div class="row" style="flex-wrap:wrap;gap:8px">${pw?`<button class="btn" data-act="inst-pwa">${iconSvg('download')} Installer sur cet appareil</button>`:''}<a class="btn ${pw?'ghost':''}" data-inst="web" href="${esc(webUrl())}" target="_blank" rel="noopener">${iconSvg('globe')} Ouvrir la version web</a><a class="btn ghost" data-inst="releases" href="${esc(dlUrl())}" target="_blank" rel="noopener">${iconSvg('folder')} Page des versions</a></div></section>
  <section class="panel" style="margin-top:12px" id="inst-main"><h3>${me!=='autre'&&!native?'Sur cet appareil : ':''}${esc(INST_STEPS[first].titre)}</h3>${block(first)}</section>
  <section class="panel" style="margin-top:12px"><h3>Autres appareils</h3>${rest.map(k=>`<details class="addbox" style="margin-top:6px"><summary>${esc(INST_STEPS[k].titre)}</summary>${block(k)}</details>`).join('')}</section>
  <section class="panel" style="margin-top:12px"><h3>Partager avec un ami</h3><p class="empty" style="margin-bottom:10px">Le lien web marche sur tous les téléphones et ordinateurs. Le lien des versions sert pour Android et Windows.</p><div class="row" style="flex-wrap:wrap;gap:8px"><button class="btn" data-act="inst-share-web">${iconSvg('share')} Partager le lien web</button><button class="btn ghost" data-act="inst-share-apk">${iconSvg('share')} Partager le lien Android et Windows</button><button class="btn ghost" data-act="inst-copy">Copier le message</button></div></section>
  <section class="panel" style="margin-top:12px"><h3>Tes données</h3><p style="margin:0">Elles restent sur chaque appareil. Active la synchronisation (Réglages, Synchronisation et sauvegardes) pour retrouver la même chose partout.</p></section>`}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act^="inst-"]');if(!b)return;const a=b.dataset.act;
  if(a==='inst-pwa'){const p=window.__pwaPrompt;if(!p)return;window.__pwaPrompt=null;try{await p.prompt();await p.userChoice}catch(x){}render();return}
  const url=a==='inst-share-apk'?dlUrl():webUrl(),msg=`Salut ! J'utilise « ${state.settings.appName||'Mon année BT'} » pour m'organiser à l'école et réviser avec l'IA (cours en photo, prof particulier, correction de devoirs, Labo d'électronique…). C'est gratuit, essaie : ${url}`;
  if(a==='inst-copy'){try{await navigator.clipboard.writeText(webUrl()&&`Salut ! J'utilise « ${state.settings.appName||'Mon année BT'} » pour m'organiser à l'école et réviser avec l'IA. C'est gratuit, essaie : ${webUrl()}`);toast('Message copié, colle-le dans WhatsApp')}catch(x){prompt('Copie ce message :',msg)}return}
  const SH=typeof nativePlugin==='function'&&nativePlugin('Share');
  try{if(SH)await SH.share({title:state.settings.appName||'Mon année BT',text:msg,dialogTitle:"Partager l'appli"});else if(navigator.share)await navigator.share({text:msg});else window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank')}catch(x){}});

render();
initLocal().then(initBackup).then(()=>scheduleReminders().catch(()=>{}));
</script>
</body>
</html>
