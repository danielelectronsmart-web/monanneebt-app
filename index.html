    if(!root)return;
    if(root.nodeType===3){procText(root);return}
    if(root.nodeType!==1||skipEl(root.parentElement)&&root!==document.body)return;
    if(root.matches&&root.matches('.x')&&root.textContent.trim()==='×'&&!root.querySelector('svg'))root.innerHTML=iconSvg('x');
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),list=[];let n;
    while((n=w.nextNode())){EMO_RE.lastIndex=0;if(EMO_RE.test(n.nodeValue))list.push(n)}
    list.forEach(procText);
    root.querySelectorAll('.x').forEach(b=>{if(b.textContent.trim()==='×'&&!b.querySelector('svg'))b.innerHTML=iconSvg('x')});
    root.querySelectorAll('option').forEach(o=>{EMO_RE.lastIndex=0;if(EMO_RE.test(o.textContent))o.textContent=stripEmoji(o.textContent)});
    root.querySelectorAll('[placeholder],[title],[aria-label],[alt]').forEach(el=>['placeholder','title','aria-label','alt'].forEach(a=>{const v=el.getAttribute(a);if(v){EMO_RE.lastIndex=0;if(EMO_RE.test(v))el.setAttribute(a,stripEmoji(v))}}));
  }
  window.iconify=iconify;
  const pending=new Set();let sched=false;
  const flush=()=>{sched=false;const arr=[...pending];pending.clear();arr.forEach(n=>{if(n.isConnected)iconify(n)})};
  new MutationObserver(recs=>{for(const r of recs){if(r.type==='characterData')pending.add(r.target);else r.addedNodes.forEach(n=>pending.add(n))}if(!sched){sched=true;queueMicrotask(flush)}}).observe(document.body,{childList:true,subtree:true,characterData:true});
  ['alert','confirm','prompt'].forEach(k=>{const o=window[k]&&window[k].bind(window);if(o)window[k]=function(m,...r){return o(stripEmoji(m),...r)}});
  iconify(document.body);
})();

/* --- chiffrement des clés avant envoi dans le cloud (AES-GCM, clé dérivée du code secret) --- */
const cryptoOK=()=>!!(window.crypto&&crypto.subtle&&crypto.getRandomValues);
const b64e=u8=>{let s='';u8.forEach(b=>s+=String.fromCharCode(b));return btoa(s)};
const b64d=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
const dk={code:null,key:null};
async function deriveKey(code){
  if(dk.code===code&&dk.key)return dk.key;
  const enc=new TextEncoder(),base=await crypto.subtle.importKey('raw',enc.encode('monanneebt:'+code),'PBKDF2',false,['deriveKey']);
  dk.key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode('mon-annee-bt-sync-v1'),iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);dk.code=code;return dk.key}
async function encJSON(obj,code){const iv=crypto.getRandomValues(new Uint8Array(12)),k=await deriveKey(code);const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(obj))));return b64e(iv)+'.'+b64e(ct)}
async function decJSON(t,code){const [a,b]=String(t).split('.');const k=await deriveKey(code);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(a)},k,b64d(b));return JSON.parse(new TextDecoder().decode(pt))}

/* --- cadres : validation, marge généreuse, découpe --- */
function normBox(b){if(!Array.isArray(b)||b.length!==4)return null;let [y0,x0,y1,x1]=b.map(Number);if([y0,x0,y1,x1].some(v=>!isFinite(v)))return null;if(y1<y0)[y0,y1]=[y1,y0];if(x1<x0)[x0,x1]=[x1,x0];return [Math.max(0,y0),Math.max(0,x0),Math.min(1000,y1),Math.min(1000,x1)]}
function validBox(b){const n=normBox(b);if(!n)return false;const w=n[3]-n[1],h=n[2]-n[0];return w>=50&&h>=50&&w*h/1e6>=.015&&w*h/1e6<=.98}
function padBox(b){const n=normBox(b);if(!n)return null;const px=30+(n[3]-n[1])*.06,py=30+(n[2]-n[0])*.06;return [Math.max(0,n[0]-py),Math.max(0,n[1]-px),Math.min(1000,n[2]+py),Math.min(1000,n[3]+px)]}
async function cropBox(blob,box){

  const bmp=await createImageBitmap(blob),W=bmp.width,H=bmp.height;
  const sx=p[1]/1000*W,sy=p[0]/1000*H,w=Math.round((p[3]-p[1])/1000*W),h=Math.round((p[2]-p[0])/1000*H);if(w<30||h<30)return null;
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(bmp,sx,sy,w,h,0,0,w,h);

  stage.addEventListener('pointermove',e=>{if(!drag||!crop)return;const r=stage.getBoundingClientRect(),dx=e.clientX-r.left-drag.px,dy=e.clientY-r.top-drag.py,W=crop.cw,H=crop.ch,s=drag.s,mn=36;
    if(drag.t==='m'){crop.st={x:Math.min(Math.max(0,s.x+dx),W-s.w),y:Math.min(Math.max(0,s.y+dy),H-s.h),w:s.w,h:s.h}}
    else{let x0=s.x,y0=s.y,x1=s.x+s.w,y1=s.y+s.h;
      if(drag.h.includes('w'))x0=Math.min(Math.max(0,s.x+dx),x1-mn);if(drag.h.includes('e'))x1=Math.max(Math.min(W,s.x+s.w+dx),x0+mn);
      if(drag.h.includes('n'))y0=Math.min(Math.max(0,s.y+dy),y1-mn);if(drag.h.includes('s'))y1=Math.max(Math.min(H,s.y+s.h+dy),y0+mn);
      crop.st={x:x0,y:y0,w:x1-x0,h:y1-y0}}
    paintCrop()});
  const end=()=>{drag=null};stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
  o.addEventListener('click',onCropClick);
}
async function onCropClick(e){
  const b=e.target.closest('[data-crop]');if(!b||!crop)return;const a=b.dataset.crop;
  if(a==='close')closeCropper();
  if(a==='rotate'){crop.work=rotC(crop.work);crop.rot=(crop.rot+1)%4;crop.guesses=[];layoutCrop(null)}
  if(a==='all'){crop.st={x:0,y:0,w:crop.cw,h:crop.ch};paintCrop()}
  if(a==='guess')await guessCrop();
  if(a==='ok')await finishCrop()}
async function finishCrop(){
  const k=crop,s=k.st,sc=k.scale,sx=s.x/sc,sy=s.y/sc,sw=s.w/sc,sh=s.h/sc;
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(sw));c.height=Math.max(1,Math.round(sh));c.getContext('2d').drawImage(k.work,sx,sy,sw,sh,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.92));
  const box=[sy/k.work.height*1000,sx/k.work.width*1000,(sy+sh)/k.work.height*1000,(sx+sw)/k.work.width*1000].map(Math.round);
  closeCropper();await k.onDone(blob,{photo:k.srcId,box,rot:k.rot})}
async function guessCrop(){
  if(crop.guesses.length){crop.gi=(crop.gi+1)%crop.guesses.length;setCropBox(crop.guesses[crop.gi]);cropMsg(`Schéma ${crop.gi+1} sur ${crop.guesses.length}. Vérifie le cadre, ou touche encore « Deviner » pour le suivant.`);return}
  if(!caps.sample||!caps.img){cropMsg("L'IA n'est pas disponible ici : entoure le schéma avec ton doigt.");return}
  cropMsg("L'IA cherche les schémas…");const k=crop;
  try{
    const blob=await new Promise(r=>k.work.toBlob(r,'image/jpeg',.85));
    const r=await caps.sample.json(`Cette photo vient du cahier ou du tableau d'un élève. Repère chaque schéma, circuit, dessin, graphique ou figure (PAS le texte seul). Pour chacun, donne un cadre [ymin, xmin, ymax, xmax] en coordonnées de 0 à 1000 qui entoure TOUT le schéma avec ses légendes, valeurs, flèches et axes, avec une marge confortable. Classe-les de haut en bas puis de gauche à droite. Réponds uniquement en JSON : {"schemas":[{"box":[ymin,xmin,ymax,xmax],"description":"..."}]}`,{images:[blob],cache:false});
    if(crop!==k)return;
    const g=(r&&r.schemas||[]).map(x=>x&&x.box).filter(validBox).map(padBox);
    if(!g.length){cropMsg("Je n'ai pas trouvé de schéma. Entoure-le toi-même avec ton doigt.");return}
    crop.guesses=g;crop.gi=0;setCropBox(g[0]);cropMsg(`J'ai trouvé ${g.length} schéma${g.length>1?'s':''}. Vérifie le cadre${g.length>1?', ou touche encore « Deviner » pour le suivant':''}.`);

/* --- redessin propre par l'IA (essai, l'original est gardé) --- */
async function svgToPng(str){
  const doc=new DOMParser().parseFromString(String(str||''),'image/svg+xml'),root=doc.documentElement;
  if(!root||root.nodeName!=='svg'||doc.querySelector('parsererror'))throw new Error('svg');
  root.querySelectorAll('script,foreignObject,image,use,style,iframe,a').forEach(n=>n.remove());
  [root,...root.querySelectorAll('*')].forEach(n=>[...n.attributes].forEach(a=>{if(/^on/i.test(a.name)||/href/i.test(a.name))n.removeAttribute(a.name)}));
  if(!root.getAttribute('xmlns'))root.setAttribute('xmlns','http://www.w3.org/2000/svg');
  const vb=(root.getAttribute('viewBox')||'').split(/[\s,]+/).map(Number);let w=vb[2],h=vb[3];
  if(!(w>0&&h>0)){w=parseFloat(root.getAttribute('width'))||600;h=parseFloat(root.getAttribute('height'))||400;root.setAttribute('viewBox',`0 0 ${w} ${h}`)}
  root.setAttribute('width',w);root.setAttribute('height',h);
  const img=await loadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(root)));
  const k=Math.min(2,1400/w),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,'image/png'))}
async function redrawSchema(it){
  if(!caps.sample||!caps.img){alert("L'IA n'est pas disponible ici.");return}
  toast("L'IA redessine le schéma…");
  try{
    const blob=await (await fetch(await photoReady(it.id))).blob();
    const r=await caps.sample.json(`Redessine proprement ce schéma (circuit électronique, figure ou graphique) en SVG : traits noirs nets d'épaisseur 2, fond transparent, symboles normalisés (résistance = rectangle, condensateur = deux traits parallèles, etc.), fils droits à angle droit, étiquettes lisibles (police sans-serif 14 à 16 px) avec EXACTEMENT les mêmes noms et valeurs que le dessin. Respecte les liaisons, n'invente rien. viewBox obligatoire (ex. 0 0 600 400), aucun script, aucune image externe. Réponds uniquement en JSON : {"svg":"<svg ...>...</svg>"}`,{images:[blob],cache:false});
    const png=await svgToPng(r&&r.svg);if(!png)throw new Error('png');
    const url=URL.createObjectURL(png),o=document.createElement('div');o.className='pickview';
    o.innerHTML=`<div class="crophead"><b>Compare</b><button class="iconbtn" data-cmp="no" aria-label="Fermer">✕</button></div><p class="cropmsg">L'IA a redessiné ton schéma. Vérifie que les liaisons et les valeurs sont justes avant de le garder.</p>
      <div class="cmpgrid"><figure><figcaption>Original</figcaption><img src="${photoUrl(it.id)}" alt="Original"></figure><figure><figcaption>Redessiné</figcaption><img src="${url}" alt="Redessiné"></figure></div>
      <div class="cropbtns"><button class="btn ghost" data-cmp="no">Garder l'original</button><button class="btn" data-cmp="yes">Utiliser le redessin</button></div>`;
    o.addEventListener('click',async e=>{const b=e.target.closest('[data-cmp]');if(!b)return;o.remove();
      if(b.dataset.cmp==='yes'){const prev=(draft.schemaSrc||{})[it.id]||{};const nid=await uploadSchema(png,{...prev,redrawn:true});if(nid){syncDraftFromDom();draft.text=draft.text.replace(it.tok,`[[img:${nid}]]`);render();toast('Schéma remplacé')}}});
    document.body.appendChild(o);
  }catch(e){alert(e&&e.code?aiErr(e):"Le redessin n'a pas fonctionné cette fois. Ton schéma d'origine est gardé.")}}

  return `<div class="planbar"><div class="row" style="gap:6px;flex-wrap:wrap">${LX.plan.map((k,j)=>`<span class="planchip ${j===i?'on':j<i?'done':''}">${j+1}. ${names[k]||k}</span>`).join('')}</div><div class="row" style="gap:8px;margin-top:10px"><button type="button" class="btn" data-act="lx-plan-next">${last?'Terminer la séance':'Étape suivante'}</button><button type="button" class="btn ghost" data-act="lx-plan-stop">Arrêter</button></div></div>`}
const _vLearnWork=vLearnWork;
vLearnWork=function(){const bar=lxPlanBar();if(!hasSource()||!LX_NEW.includes(learn.mode))return bar+_vLearnWork();return bar+lxView(learn.mode)};
const _resetLearnOutputs=resetLearnOutputs;
resetLearnOutputs=function(){_resetLearnOutputs();const p=LX.plan,pi=LX.planI;LX=lxFresh();LX.plan=p;LX.planI=pi};
function lxView(m){return (learn.err?`<p class="info">${esc(learn.err)}</p>`:'')+({fey:vFey,oq:vOq,cz:vCz,tf:vTf,ws:vWs,ana:vAna,cmp:vCmp})[m]()}

/* --- 1. Explique avec tes mots (Feynman) --- */
function vFey(){
  const f=LX.fey,h=lxHead('Explique avec tes mots');if(learn.busy)return h+lxBusy();
  if(f.res){const r=f.res,col=r.note>=7?'var(--ok)':r.note>=4?'var(--copper)':'var(--danger)';
    return `${h}<div class="row" style="align-items:center;gap:14px;margin-bottom:12px"><div class="avg" style="color:${col}">${r.note}/10</div><div class="grow"><b>${esc(f.concept)}</b><div class="meta">${r.note>=7?"Tu as bien compris l'essentiel.":r.note>=4?'Bonne base, quelques points à corriger.':'Pas encore solide : reprends avec les corrections.'}</div></div></div>
    ${r.juste.length?`<h4 class="lxs ok">Ce qui est juste</h4><ul class="lxl">${r.juste.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    ${r.erreurs.length?`<h4 class="lxs ko">À corriger</h4><ul class="lxl">${r.erreurs.map(x=>`<li><s>${esc(x.dit||'')}</s><br><b>${esc(x.correction||'')}</b></li>`).join('')}</ul>`:''}
    ${r.manques.length?`<h4 class="lxs">Tu as oublié</h4><ul class="lxl">${r.manques.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    ${r.version?`<h4 class="lxs">Une explication modèle</h4><p class="lxq">${esc(r.version)}</p>`:''}
    ${r.relance?`<h4 class="lxs">Pour aller plus loin</h4><p style="margin:0">${esc(r.relance)}</p>`:''}
    <div class="row" style="flex-wrap:wrap;margin-top:14px"><button class="btn" data-act="lx-fey-again">Réécrire avec les corrections</button><button class="btn ghost" data-act="lx-fey-new">Autre notion</button></div>`}
  return `${h}
    <div class="editor"><label>Notion à expliquer<input id="feyConcept" value="${esc(f.concept)}" placeholder="Ex. la loi d'Ohm, le transistor, la photosynthèse…"></label></div>
    <div class="row" style="margin:8px 0"><button type="button" class="btn ghost" data-act="lx-fey-ideas">Me proposer des notions</button></div>
    ${f.ideas?`<div class="sugg">${f.ideas.map(x=>`<button type="button" data-act="lx-fey-pick" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>`:''}
    <div class="editor" style="margin-top:10px"><label>Explique-la comme à un enfant de 10 ans, sans regarder ton cours<textarea id="feyText" rows="7" placeholder="Écris avec tes mots. Astuce : le micro du clavier de ton téléphone marche très bien.">${esc(f.text)}</textarea></label></div>
    <button class="btn" style="margin-top:10px" data-act="lx-fey-go">Voir ce que j'ai compris</button>`}

/* --- 2. Questions ouvertes --- */
function vOq(){
  const o=LX.oq,h=lxHead('Questions ouvertes');if(learn.busy)return h+lxBusy();
  if(!o.qs)return h+''+lxIntro("L'IA te pose 5 questions de compréhension tirées de ton cours (pourquoi, comment, que se passe-t-il si…). Tu réponds avec tes mots, sans regarder, puis elle te corrige question par question.","Commencer (5 questions)",'lx-oq-start');
  if(o.res){const max=o.qs.length*2,tot=o.res.total;
    return `${h}<div class="row" style="align-items:center;gap:14px;margin-bottom:10px"><div class="avg">${tot}/${max}</div><div class="grow"><b>${Math.round(tot/max*20)}/20</b><div class="meta">${tot/max>=.8?'Très bien, tu maîtrises.':tot/max>=.5?'Tu as les bases, regarde les corrections.':'Reprends le cours puis refais cette méthode.'}</div></div></div>
    ${o.res.conseil?`<p class="lxq">${esc(o.res.conseil)}</p>`:''}
    <ul class="list">${o.qs.map((q,i)=>{const r=o.res.items[i]||{note:0};return `<li class="item" style="flex-direction:column;align-items:stretch"><div class="row" style="justify-content:space-between"><b>${i+1}. ${esc(q.q)}</b><span class="tag">${r.note}/2</span></div><div class="meta">Ta réponse : ${esc(o.ans[i]||'(vide)')}</div><div>${esc(r.retour||'')}</div><div class="meta"><b>À retenir :</b> ${esc(r.a_retenir||q.modele||'')}</div></li>`}).join('')}</ul>
    <div class="row" style="flex-wrap:wrap;margin-top:12px"><button class="btn" data-act="lx-oq-start">Nouvelles questions</button></div>`}
  const i=o.i,q=o.qs[i],last=i===o.qs.length-1;
  return `${h}<div class="bar" style="margin-bottom:10px"><i style="width:${i/o.qs.length*100}%;background:var(--copper)"></i></div><p class="meta" style="margin:0">Question ${i+1} sur ${o.qs.length}</p><p style="font-size:1.12rem;font-weight:600;margin:4px 0 10px">${esc(q.q)}</p>
    <div class="editor"><textarea data-oqa="1" rows="6" placeholder="Réponds avec tes mots…">${esc(o.ans[i]||'')}</textarea></div>
    <div class="row" style="flex-wrap:wrap;margin-top:10px">${i>0?'<button class="btn ghost" data-act="lx-oq-prev">Précédente</button>':''}<button class="btn" data-act="lx-oq-next">${last?'Corriger mes réponses':'Question suivante'}</button></div>`}

/* --- 3. Texte à trous --- */
function lxCloze(txt){const parts=[],re=/\{\{([^}]+)\}\}/g;let last=0,m,k=0;while((m=re.exec(txt))){parts.push({t:txt.slice(last,m.index)});parts.push({k:k++,a:m[1].trim()});last=re.lastIndex}parts.push({t:txt.slice(last)});return parts}
function vCz(){
  const c=LX.cz,h=lxHead('Texte à trous');if(learn.busy)return h+lxBusy();
  if(!c.d)return h+''+lxIntro("L'IA écrit un résumé de ton cours en cachant les mots-clés. Tu les retrouves de tête, sans regarder.","Créer mon texte à trous",'lx-cz-start');
  const parts=lxCloze(c.d.texte);
  const body=parts.map(p=>{
    if(p.t!==undefined)return esc(p.t).replace(/\n/g,'<br>');
    const v=c.vals[p.k]||'',first=p.a.split('|')[0],st=c.checked?(lxOk(v,p.a)?' ok':' ko'):'';
    return `<input class="cloze${st}" data-cz="${p.k}" value="${esc(v)}" ${c.checked?'readonly':''} placeholder="${c.hint?esc(first[0]+'…'):''}" style="width:${Math.max(6,first.length+3)}ch" autocomplete="off" autocapitalize="none" spellcheck="false">${c.checked&&!lxOk(v,p.a)?`<span class="czfix">${esc(first)}</span>`:''}`}).join('');
  const n=parts.filter(p=>p.k!==undefined).length;
  return `${h}<h4 class="lxs" style="margin-top:0">${esc(c.d.titre||'')}</h4><div class="czbox">${body}</div>
    ${c.checked?`<div class="info" style="margin-top:12px"><b>${c.score} / ${n}</b> mots retrouvés. ${c.score===n?'Parfait !':c.score>=n*.6?'Pas mal, relis les mots en vert à côté de tes erreurs.':'Relis le cours puis recommence.'}</div><div class="row" style="flex-wrap:wrap;margin-top:10px"><button class="btn" data-act="lx-cz-again">Recommencer</button><button class="btn ghost" data-act="lx-cz-start">Nouveau texte</button></div>`
    :`<div class="row" style="flex-wrap:wrap;margin-top:12px"><button class="btn" data-act="lx-cz-check">Vérifier</button><button class="btn ghost" data-act="lx-cz-hint">${c.hint?'Cacher les indices':'Indice : première lettre'}</button></div>`}`}

/* --- 4. Vrai ou faux piégeux --- */
function vTf(){
  const t=LX.tf,h=lxHead('Vrai ou faux piégeux');if(learn.busy)return h+lxBusy();
  if(!t.items)return h+''+lxIntro("8 affirmations, dont la moitié sont fausses avec une erreur typique. À toi de les repérer.","Commencer",'lx-tf-start');
  const n=t.items.length;
  if(t.i>=n){const ok=t.items.filter((it,i)=>t.picks[i]===it.vrai).length,bad=t.items.map((it,i)=>({it,i})).filter(x=>t.picks[x.i]!==x.it.vrai);
    return `${h}<div class="row" style="align-items:center;gap:14px;margin-bottom:10px"><div class="avg">${ok}/${n}</div><div class="grow"><div class="meta">${ok===n?'Aucun piège ne t\'a échappé.':ok>=n*.7?'Bien, regarde les pièges ratés.':'Beaucoup de pièges : relis le cours puis recommence.'}</div></div></div>
    ${bad.length?`<h4 class="lxs ko">Les pièges ratés</h4><ul class="list">${bad.map(x=>`<li class="item" style="flex-direction:column;align-items:stretch"><b>${esc(x.it.enonce)}</b><div class="meta">C'était ${x.it.vrai?'vrai':'faux'}. ${esc(x.it.explication||'')}</div></li>`).join('')}</ul>`:''}
    <div class="row" style="margin-top:12px"><button class="btn" data-act="lx-tf-start">Nouvelles affirmations</button></div>`}
  const it=t.items[t.i],p=t.picks[t.i];
  return `${h}<div class="bar" style="margin-bottom:10px"><i style="width:${t.i/n*100}%;background:var(--copper)"></i></div><p class="meta" style="margin:0">Affirmation ${t.i+1} sur ${n}</p><p class="lxq" style="font-size:1.12rem;margin:8px 0 14px">${esc(it.enonce)}</p>
    ${p===undefined?`<div class="tfbtns"><button class="btn" data-act="lx-tf" data-v="1">Vrai</button><button class="btn ghost" data-act="lx-tf" data-v="0">Faux</button></div>`
    :`<div class="info"><b>${p===it.vrai?'Bien vu.':'Piège !'}</b> C'était ${it.vrai?'vrai':'faux'}. ${esc(it.explication||'')}</div><button class="btn" style="margin-top:10px" data-act="lx-tf-next">${t.i+1<n?'Suivante':'Voir mon score'}</button>`}`}

/* --- 5. Pas à pas : exemple résolu puis exercice jumeau --- */
function vWs(){
  const w=LX.ws,h=lxHead('Pas à pas');if(learn.busy)return h+lxBusy();
  if(!w.d)return h+''+lxIntro("L'IA résout un exercice typique de ton cours étape par étape en expliquant pourquoi. Ensuite, c'est à toi sur un exercice jumeau, avec des indices si tu bloques.","Voir un exemple",'lx-ws-start');
  const ex=w.d.exemple,tw=w.d.jumeau,steps=ex.etapes,shown=Math.min(w.step,steps.length);
  let html=`${h}<h4 class="lxs" style="margin-top:0">Un exemple résolu</h4><p class="lxq">${esc(ex.enonce)}</p><ol class="lxo">${steps.slice(0,shown).map(s=>`<li><b>${esc(s.faire)}</b>${s.pourquoi?`<div class="meta">Pourquoi : ${esc(s.pourquoi)}</div>`:''}</li>`).join('')}</ol>`;
  if(shown<steps.length)return html+`<button class="btn" data-act="lx-ws-step">Étape suivante (${shown}/${steps.length})</button>`;
  html+=`<p class="info"><b>Résultat :</b> ${esc(ex.resultat||'')}</p><h4 class="lxs">À toi maintenant</h4><p class="lxq">${esc(tw.enonce)}</p>
    <div class="editor"><textarea id="wsAtt" rows="6" placeholder="Écris ta résolution…">${esc(w.att)}</textarea></div>
    ${w.hint?`<ul class="lxl" style="margin-top:8px">${tw.indices.slice(0,w.hint).map((x,i)=>`<li><b>Indice ${i+1} :</b> ${esc(x)}</li>`).join('')}</ul>`:''}
    <div class="row" style="flex-wrap:wrap;margin-top:10px">${w.hint<tw.indices.length?`<button class="btn ghost" data-act="lx-ws-hint">Indice ${w.hint+1}</button>`:''}<button class="btn" data-act="lx-ws-check">Corriger ma réponse</button><button class="btn ghost" data-act="lx-ws-sol">${w.sol?'Cacher':'Voir'} la solution</button></div>
    ${w.fb?`<div class="info" style="margin-top:12px"><b>${w.fb.verdict==='juste'?'C\'est juste.':w.fb.verdict==='partiel'?'En partie juste.':'Pas tout à fait.'}</b> ${esc(w.fb.retour||'')}${w.fb.conseil?`<br><span class="meta">${esc(w.fb.conseil)}</span>`:''}</div>`:''}
    ${w.sol?`<div class="lxq" style="margin-top:12px"><b>Solution :</b><br>${esc(tw.solution||'').replace(/\n/g,'<br>')}</div>`:''}
    <div class="row" style="margin-top:12px"><button class="btn ghost" data-act="lx-ws-start">Autre exemple</button></div>`;
  return html}

/* --- 6. Analogies et astuces --- */
function vAna(){
  const a=LX.ana,h=lxHead('Analogies et astuces');if(learn.busy)return h+lxBusy();
  if(!a.items)return h+''+lxIntro("Pour les notions importantes, l'IA trouve une image de la vie de tous les jours, un truc pour mémoriser, et le piège à éviter.","Chercher des astuces",'lx-ana-start');

/* --- 7. Comparer --- */
function vCmp(){
  const c=LX.cmp,h=lxHead('Comparer');if(learn.busy)return h+lxBusy();
  const form=`<div class="grid two" style="gap:10px"><div class="editor"><label>Notion A<input id="cmpA" value="${esc(c.a)}" placeholder="Ex. diode"></label></div><div class="editor"><label>Notion B<input id="cmpB" value="${esc(c.b)}" placeholder="Ex. transistor"></label></div></div>

    ${d.difference?`<p class="lxq" style="margin-top:12px"><b>La différence essentielle :</b> ${esc(d.difference)}</p>`:''}${d.astuce?`<p style="margin:0 0 12px"><b>Pour ne plus les confondre :</b> ${esc(d.astuce)}</p>`:''}
    <h4 class="lxs">Une autre comparaison</h4>${form}`}

/* --- actions --- */
const lxDom=()=>{const g=id=>document.getElementById(id);
  if(g('feyConcept'))LX.fey.concept=g('feyConcept').value;if(g('feyText'))LX.fey.text=g('feyText').value;
  if(g('cmpA'))LX.cmp.a=g('cmpA').value;if(g('cmpB'))LX.cmp.b=g('cmpB').value;if(g('wsAtt'))LX.ws.att=g('wsAtt').value;
  const q=document.querySelector('[data-oqa]');if(q&&LX.oq.qs)LX.oq.ans[LX.oq.i]=q.value};
main.addEventListener('input',e=>{const t=e.target;
  if(t.id==='feyConcept')LX.fey.concept=t.value;if(t.id==='feyText')LX.fey.text=t.value;
  if(t.id==='cmpA')LX.cmp.a=t.value;if(t.id==='cmpB')LX.cmp.b=t.value;if(t.id==='wsAtt')LX.ws.att=t.value;
  if(t.dataset&&t.dataset.oqa!==undefined&&LX.oq.qs)LX.oq.ans[LX.oq.i]=t.value;
  if(t.dataset&&t.dataset.cz!==undefined)LX.cz.vals[t.dataset.cz]=t.value});
main.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act^="lx-"]');if(!b)return;
  const a=b.dataset.act;lxDom();learn.err='';
  switch(a){
    case 'lx-plan-start':if(!hasSource()){learn.err="Choisis d'abord un cours (ou écris un sujet), puis lance la séance.";render();return}LX.plan=['fey','cz','oq'];LX.planI=0;learn.mode='fey';render();window.scrollTo({top:0});return;
    case 'lx-plan-next':if(LX.planI>=LX.plan.length-1){logMin(20);toast('Séance terminée, bravo !');if(typeof celebrate==='function')celebrate();LX.plan=null;render()}else{LX.planI++;learn.mode=LX.plan[LX.planI];render()}window.scrollTo({top:0});return;
    case 'lx-plan-stop':LX.plan=null;render();return;
    /* Feynman */
    case 'lx-fey-ideas':await lxGen('fey-ideas',"L'IA cherche des notions…","Propose 6 notions importantes à expliquer à partir de cette matière (titres courts). Réponds uniquement en JSON : {\"notions\":[\"...\",\"...\"]}",r=>{LX.fey.ideas=lxA(r.notions).slice(0,6);if(!LX.fey.ideas.length)throw 0});return;
    case 'lx-fey-pick':LX.fey.concept=b.dataset.v;paintLearn();return;
    case 'lx-fey-again':LX.fey.res=null;paintLearn();return;
    case 'lx-fey-new':LX.fey.concept='';LX.fey.text='';LX.fey.res=null;paintLearn();return;
    case 'lx-fey-go':{const f=LX.fey;
      if(!f.concept.trim()){learn.err='Choisis ou écris la notion à expliquer.';paintLearn();return}
      if(f.text.trim().length<40){learn.err="Écris au moins 2 ou 3 phrases pour que je puisse te corriger.";paintLearn();return}
      await lxGen('fey','',`L'élève doit expliquer la notion « ${f.concept} » avec ses propres mots, comme à un enfant de 10 ans, sans regarder son cours. Voici son explication :\n"""${f.text.slice(0,4000)}"""\nCompare avec le cours (ou le programme). Sois bienveillant mais exact. Réponds uniquement en JSON : {"note":entier de 0 à 10,"juste":["ce qui est correct et bien dit"],"erreurs":[{"dit":"ce que l'élève a dit de faux ou d'imprécis","correction":"la bonne version"}],"manques":["idée importante oubliée"],"version_simple":"une explication modèle simple en 4 à 6 phrases avec une image de la vie courante","relance":"une question pour aller plus loin"}`,r=>{
        const note=lxClamp(r.note,0,10);f.res={note,juste:lxA(r.juste),erreurs:lxA(r.erreurs).filter(x=>x&&typeof x==='object'),manques:lxA(r.manques),version:String(r.version_simple||''),relance:String(r.relance||'')};lxRecord('feynman',note,10)});return}
    /* Questions ouvertes */
    case 'lx-oq-start':await lxGen('oq',"L'IA prépare tes questions…","Crée 5 questions ouvertes de compréhension (pas de simple récitation : pourquoi, comment, que se passe-t-il si, explique…), de difficulté progressive. Pour chacune, donne la réponse modèle courte (2 à 4 phrases). Réponds uniquement en JSON : {\"questions\":[{\"q\":\"...\",\"modele\":\"...\"}]}",r=>{const qs=lxA(r.questions).filter(x=>x&&x.q).map(x=>({q:String(x.q),modele:String(x.modele||'')}));if(qs.length<2)throw 0;LX.oq={qs,i:0,ans:[],res:null}});return;
    case 'lx-oq-prev':LX.oq.i=Math.max(0,LX.oq.i-1);paintLearn();return;
    case 'lx-oq-next':{const o=LX.oq;
      if(o.i<o.qs.length-1){o.i++;paintLearn();return}
      if(!o.ans.some(x=>x&&x.trim())){learn.err='Écris au moins une réponse avant de corriger.';paintLearn();return}
      const items=o.qs.map((q,i)=>({question:q.q,reponse_modele:q.modele,reponse_eleve:(o.ans[i]||'').slice(0,1500)}));
      await lxGen('oq-eval','L\'IA corrige tes réponses…',`Corrige ces réponses d'élève. Pour chaque question, note 0, 1 ou 2 (2 = juste et complet, 1 = en partie, 0 = faux ou vide), donne un retour court et bienveillant, et rappelle ce qu'il faut retenir. QUESTIONS ET RÉPONSES : ${JSON.stringify(items)}\nRéponds uniquement en JSON : {"resultats":[{"note":0,"retour":"...","a_retenir":"..."}],"conseil":"un conseil global en une phrase"}`,r=>{
        const res=lxA(r.resultats).map(x=>({note:lxClamp(x&&x.note,0,2),retour:String(x&&x.retour||''),a_retenir:String(x&&x.a_retenir||'')}));while(res.length<o.qs.length)res.push({note:0,retour:'',a_retenir:''});
        const total=res.slice(0,o.qs.length).reduce((s,x)=>s+x.note,0);o.res={items:res,total,conseil:String(r.conseil||'')};lxRecord('open',total,o.qs.length*2)});return}
    /* Texte à trous */
    case 'lx-cz-start':await lxGen('cz','',"Écris un résumé clair du cours en un texte suivi de 120 à 180 mots (pas de liste). Puis cache les 8 à 12 mots ou expressions les plus importants (termes clés, valeurs, définitions) en les entourant de doubles accolades, par exemple {{résistance}}. Si une réponse peut s'écrire de plusieurs façons, sépare-les avec | par exemple {{ampère|ampères}}. Réponds uniquement en JSON : {\"titre\":\"...\",\"texte\":\"...\"}",r=>{const t=String(r.texte||'');if(lxCloze(t).filter(p=>p.k!==undefined).length<3)throw 0;LX.cz={d:{titre:String(r.titre||''),texte:t},vals:{},checked:false,hint:false,score:null,rec:false}});return;
    case 'lx-cz-hint':LX.cz.hint=!LX.cz.hint;paintLearn();return;
    case 'lx-cz-again':LX.cz.vals={};LX.cz.checked=false;LX.cz.score=null;paintLearn();return;
    case 'lx-cz-check':{const c=LX.cz,blanks=lxCloze(c.d.texte).filter(p=>p.k!==undefined);c.score=blanks.filter(p=>lxOk(c.vals[p.k],p.a)).length;c.checked=true;
      if(!c.rec){c.rec=true;lxRecord('cloze',c.score,blanks.length)}paintLearn();return}
    /* Vrai ou faux */
    case 'lx-tf-start':await lxGen('tf','',"Crée 8 affirmations vrai ou faux sur ce cours, dont 4 fausses. Les fausses contiennent une erreur piège typique (confusion fréquente, inversion, mauvaise unité) mais restent plausibles. Mélange l'ordre. Pour chacune, une explication courte (1 à 2 phrases) qui corrige. Réponds uniquement en JSON : {\"items\":[{\"enonce\":\"...\",\"vrai\":true,\"explication\":\"...\"}]}",r=>{const items=lxA(r.items).filter(x=>x&&x.enonce).map(x=>({enonce:String(x.enonce),vrai:x.vrai===true||x.vrai==='true',explication:String(x.explication||'')}));if(items.length<3)throw 0;LX.tf={items,i:0,picks:[],rec:false}});return;
    case 'lx-tf':LX.tf.picks[LX.tf.i]=b.dataset.v==='1';paintLearn();return;
    case 'lx-tf-next':{const t=LX.tf;t.i++;if(t.i>=t.items.length&&!t.rec){t.rec=true;lxRecord('tf',t.items.filter((it,i)=>t.picks[i]===it.vrai).length,t.items.length)}paintLearn();return}
    /* Pas à pas */
    case 'lx-ws-start':await lxGen('ws','',"À partir du cours, choisis un type d'exercice typique. 1) Résous un EXEMPLE complet étape par étape : énoncé, étapes numérotées (chaque étape = ce qu'on fait + POURQUOI, en une ou deux phrases), résultat final. 2) Invente un EXERCICE JUMEAU (même méthode, autres valeurs ou autre situation) avec 3 indices progressifs (le 1er très discret, le 3e presque la solution) et la solution complète rédigée. Si la matière est littéraire (langue, histoire…), fais une analyse ou une rédaction guidée. Réponds uniquement en JSON : {\"exemple\":{\"enonce\":\"...\",\"etapes\":[{\"faire\":\"...\",\"pourquoi\":\"...\"}],\"resultat\":\"...\"},\"jumeau\":{\"enonce\":\"...\",\"indices\":[\"...\",\"...\",\"...\"],\"solution\":\"...\"}}",r=>{
        const ex=r.exemple||{},tw=r.jumeau||{};const etapes=lxA(ex.etapes).map(s=>typeof s==='string'?{faire:s,pourquoi:''}:{faire:String(s.faire||''),pourquoi:String(s.pourquoi||'')}).filter(s=>s.faire);
        if(!ex.enonce||etapes.length<2||!tw.enonce)throw 0;LX.ws={d:{exemple:{enonce:String(ex.enonce),etapes,resultat:String(ex.resultat||'')},jumeau:{enonce:String(tw.enonce),indices:lxA(tw.indices).map(String),solution:String(tw.solution||'')}},step:1,hint:0,att:'',sol:false,fb:null}});return;
    case 'lx-ws-step':LX.ws.step++;paintLearn();return;
    case 'lx-ws-hint':LX.ws.hint++;paintLearn();return;
    case 'lx-ws-sol':LX.ws.sol=!LX.ws.sol;paintLearn();return;
    case 'lx-ws-check':{const w=LX.ws,tw=w.d.jumeau;if(w.att.trim().length<3){learn.err='Écris d\'abord ta réponse.';paintLearn();return}
      await lxGen('ws-check','L\'IA corrige ta réponse…',`Exercice : ${tw.enonce}\nSolution attendue : ${tw.solution}\nRéponse de l'élève : ${w.att.slice(0,2000)}\nDis si c'est juste, ce qui est bien, l'erreur éventuelle et comment la corriger, sans donner toute la solution si l'élève a presque réussi. Réponds uniquement en JSON : {"verdict":"juste ou partiel ou faux","retour":"...","conseil":"..."}`,r=>{w.fb={verdict:['juste','partiel','faux'].includes(r.verdict)?r.verdict:'partiel',retour:String(r.retour||''),conseil:String(r.conseil||'')}});return}
    /* Analogies */
    case 'lx-ana-start':await lxGen('ana','',"Pour 5 à 6 notions importantes du cours, donne : une ANALOGIE tirée de la vie de tous les jours (concrète, imagée), une ASTUCE MNÉMOTECHNIQUE (acronyme, phrase, rime ou image à retenir), et le PIÈGE À ÉVITER (erreur fréquente). Réponds uniquement en JSON : {\"notions\":[{\"notion\":\"...\",\"analogie\":\"...\",\"astuce\":\"...\",\"piege\":\"...\"}]}",r=>{const items=lxA(r.notions).filter(x=>x&&x.notion);if(!items.length)throw 0;LX.ana={items,saved:false}});return;
    case 'lx-ana-say':{stopSpeech();speak(LX.ana.items.map(x=>`${x.notion}. ${x.analogie}. À retenir : ${x.astuce}.`).join(' '),{rate:learn.rate});return}
    case 'lx-ana-save':{const c=learn.sel.map(id=>courses.find(x=>x.id===id)).find(Boolean);
      const text=LX.ana.items.map(x=>`## ${x.notion}\n- Image : ${x.analogie||''}\n- À retenir : ${x.astuce||''}${x.piege?`\n- Piège : ${x.piege}`:''}`).join('\n\n');
      await saveCourse({id:uid(),title:'Astuces mémoire : '+(c?c.title:learn.topic.trim()||'mon cours'),subjectId:c?c.subjectId:(state.subjects[0]||{}).id,date:iso(today()),text,photos:[],source:'ia',created:Date.now()});LX.ana.saved=true;toast('Astuces enregistrées dans Mes cours');paintLearn();return}
    /* Comparer */
    case 'lx-cmp-go':case 'lx-cmp-auto':{const c=LX.cmp,A=a==='lx-cmp-go'?c.a.trim():'',B=a==='lx-cmp-go'?c.b.trim():'';
      if(a==='lx-cmp-go'&&(!A||!B)){learn.err='Écris les deux notions, ou touche « Laisser l\'IA choisir ».';paintLearn();return}
      await lxGen('cmp','',`${A&&B?`Compare « ${A} » et « ${B} ».`:"Choisis deux notions du cours qu'on confond souvent et compare-les."} Construis un tableau de 4 à 6 critères. Réponds uniquement en JSON : {"titre":"A contre B","a":"nom de A","b":"nom de B","lignes":[{"critere":"...","a":"...","b":"..."}],"difference":"la différence essentielle en une phrase","astuce":"comment ne plus les confondre"}`,r=>{const lignes=lxA(r.lignes).filter(x=>x&&x.critere);if(lignes.length<2)throw 0;LX.cmp.d={titre:String(r.titre||''),a:String(r.a||A||'A'),b:String(r.b||B||'B'),lignes,difference:String(r.difference||''),astuce:String(r.astuce||'')}});return}
  }});

/* ================= Équipe d'IA : binôme, missions, surveillance mutuelle, relais ================= */
const MISSIONS={
 devoir:{titre:'Corriger le devoir',objectif:"Corriger ce devoir sans aucune erreur de calcul, de méthode ou de notation",criteres:"chaque réponse est vérifiée, la démarche est juste, la note correspond au barème",chef:'duo'},
 exam:{titre:"Corriger l'examen blanc",objectif:"Corriger cette copie d'examen avec rigueur et justice",criteres:"le barème est respecté, les calculs sont exacts, la note sur 20 est justifiée",chef:'duo'},
 question:{titre:"Répondre à l'élève",objectif:"Donner une réponse exacte, claire et adaptée au niveau de l'élève",criteres:"aucune erreur factuelle, explication simple, exemples adaptés",chef:'main'},
 generic:{titre:'Mission',objectif:"Donner la meilleure réponse possible à l'élève",criteres:"exacte, claire, complète",chef:'main'}
};
function parseLoose(t){t=String(t||'').replace(/```json|```/g,'');const i=t.indexOf('{'),j=t.lastIndexOf('}');if(i<0||j<=i)return null;try{return JSON.parse(t.slice(i,j+1))}catch(e){return null}}
const shortErr=e=>{const c=e&&e.code;return c==='no_credit'?'crédit épuisé':c==='bad_key'?'clé refusée':c==='rate_limited'?'limite atteinte':c==='offline'?'hors connexion':c==='bad_model'?'modèle inconnu':c==='overloaded'?'serveur saturé':"n'a pas répondu"};
/* --- classement : missions réussies / ratées, banc après 3 échecs d'affilée --- */
const aiStats=()=>aiCfg().stats||{};
const benched=id=>{const s=aiStats()[id];return !!(s&&s.bench&&s.bench>Date.now())};
function agentResult(id,ok){
  const c=aiCfg();c.stats=c.stats||{};const s=c.stats[id]=c.stats[id]||{ok:0,ko:0,streak:0,bench:0};
  if(ok){s.ok++;s.streak=0}else{s.ko++;s.streak++;if(id!=='main'&&s.streak>=3)s.bench=Date.now()+6*3600e3}
  localStorage.setItem(CFG_KEY,JSON.stringify(c))}
function duoAgent(){const ex=extrasOn();return ex.find(a=>a.role==='duo')||ex[0]||null}
function dnIA(name,i,role){
  if(!maskOn())return name;
  if(role==='main'||(role===undefined&&i===0))return 'IA principale';
  if(role==='duo')return 'Spécialiste devoirs';
  if(/\(relecture\)$/.test(String(name)))return 'Relecture';
  return 'IA '+(i+1)}
const whoAI=p=>maskOn()?(p.role==='main'?"L'IA principale":p.role==='duo'?'Le spécialiste devoirs':'Une IA'):p.label;

/* --- une mission d'équipe : travail, relecture croisée, décision du chef, vérification, bilan --- */
async function teamRun({sys,task,img,onStep,mission}){
  const M=MISSIONS[mission]||MISSIONS.generic,step=onStep||(()=>{});
  const duo=duoAgent(),agents=extrasOn();
  const P=[{id:'main',label:mainLabel(),role:'main'}];
  if(duo)P.push({id:duo.id,label:duo.label,role:'duo',agent:duo});
  agents.filter(a=>!duo||a.id!==duo.id).forEach(a=>P.push({id:a.id,label:a.label,role:'renfort',agent:a}));
  const briefing=`MISSION : ${M.objectif}.\nCRITÈRES DE RÉUSSITE : ${M.criteres}.\nTu fais partie d'une équipe d'IA : chaque membre est relu par un collègue, et une mission ratée est enregistrée au classement. Réussis la tienne.\n\n`;
  const ask=(p,prompt,opts,json)=>p.role==='main'?geminiCall(sys+'\n\n'+prompt,opts||{},!!json):callAgent(p.agent,[{role:'system',content:sys},{role:'user',content:prompt}]);
  step(`👥 ${P.length} IA reçoivent la mission et travaillent chacune de leur côté${maskOn()?'':' : '+P.map(p=>p.label).join(', ')}…`);
  /* 1. travail en parallèle */
  const res=await Promise.allSettled(P.map(p=>ask(p,briefing+task,p.role==='main'&&img?{images:[img]}:{})));
  P.forEach((p,i)=>{const r=res[i];p.ok=r.status==='fulfilled'&&String(r.value.text||'').trim().length>=5;p.text=p.ok?String(r.value.text).trim():'';p.err=p.ok?'':(r.status==='rejected'?shortErr(r.reason):"réponse vide")});
  const okList=P.filter(p=>p.ok);
  if(!okList.length){P.forEach(p=>agentResult(p.id,false));throw (res.find(r=>r.status==='rejected')||{}).reason||aiError('upstream')}
  /* 2. relecture croisée : chacun surveille son voisin */
  const reviews={};
  if(okList.length>=2){
    step(maskOn()?"🔍 Chaque IA relit le travail de son voisin pour chercher des erreurs…":`🔍 Chaque IA relit le travail de son voisin : ${okList.map((p,i)=>`${p.label} relit ${okList[(i+1)%okList.length].label}`).join(', ')}…`);
    await Promise.all(okList.map(async(rv,i)=>{
      const au=okList[(i+1)%okList.length];
      const prompt=`${briefing}RELECTURE. Voici la tâche :\n${task.slice(0,6000)}\n\nVoici le travail d'un collègue à vérifier :\n${au.text.slice(0,8000)}\n\nCherche les erreurs réelles (faits, calculs, méthode, oublis, hors-sujet). Réponds uniquement en JSON : {"note":nombre de 0 à 10,"erreurs":[{"ou":"question ou passage","probleme":"...","correction":"...","grave":true ou false}]} ("grave" = l'erreur change le résultat final).`;
      try{const raw=(await ask(rv,prompt,{},true)).text;reviews[au.id]={by:rv,j:parseLoose(raw)}}
      catch(e){rv.revErr=true;reviews[au.id]={by:rv,j:null}}}));
  }
  P.forEach(p=>{
    if(!p.ok){p.good=false;return}
    const j=(reviews[p.id]||{}).j;
    p.erreurs=j?lxA(j.erreurs).filter(x=>x&&typeof x==='object'):[];
    p.graves=p.erreurs.filter(x=>x.grave===true||x.grave==='true').length;
    p.note=j&&isFinite(parseFloat(j.note))?Math.max(0,Math.min(10,parseFloat(j.note))):null;
    p.good=!(p.graves>0||(p.note!==null&&p.note<6));
    if(p.revErr){p.good=false;p.err='relecture impossible'}
  });
  /* 3. le chef décide (le spécialiste pour les devoirs) */
  let chef=(M.chef==='duo'?P.find(p=>p.role==='duo'&&p.ok):null)||P.find(p=>p.role==='main'&&p.ok)||okList[0];
  let finalText='';
  if(okList.length===1)finalText=okList[0].text;
  else{
    step(`🧑‍⚖️ ${whoAI(chef)} compare les travaux, vérifie les erreurs signalées et écrit la version finale…`);
    const dossier=okList.map((p,i)=>{const r=reviews[p.id];return `### Travail du membre ${i+1}\n${p.text.slice(0,7000)}\n#### Relecture par un collègue : ${r&&r.j?`note ${p.note===null?'?':p.note}/10 ; erreurs signalées : ${JSON.stringify(p.erreurs).slice(0,1500)}`:'aucune relecture exploitable'}`}).join('\n\n');
    const cp=`${briefing}Tu es le chef d'équipe. Voici le dossier.\n\nTÂCHE :\n${task.slice(0,6000)}\n\n${dossier}\n\nÉcris LA version finale pour l'élève : garde ce qui est juste, vérifie toi-même chaque erreur signalée et corrige celles qui sont réelles, tranche les désaccords en expliquant quelle réponse est la plus fiable et pourquoi. Garde les liens de sources s'il y en a. Parle directement à l'élève.`;
    try{finalText=String((await ask(chef,cp)).text||'').trim()}
    catch(e){const alt=okList.find(p=>p!==chef);chef.err=chef.err||shortErr(e);if(alt){try{finalText=String((await ask(alt,cp)).text||'').trim();chef=alt}catch(e2){}}}
    if(!finalText)finalText=okList.slice().sort((a,b)=>(b.note==null?0:b.note)-(a.note==null?0:a.note))[0].text;
  }
  /* 4. vérification finale seulement si une erreur grave avait été signalée */
  const checker=okList.find(p=>p!==chef);
  if(checker&&P.some(p=>p.graves>0)){
    step(`✅ ${whoAI(checker)} vérifie une dernière fois la version finale…`);
    try{
      const vp=`${briefing}VÉRIFICATION FINALE. Tâche :\n${task.slice(0,5000)}\n\nVersion finale proposée :\n${finalText.slice(0,9000)}\n\nReste-t-il une erreur réelle ? Réponds uniquement en JSON : {"ok":true ou false,"erreurs":[{"ou":"...","probleme":"...","correction":"..."}]}`;
      const j=parseLoose((await ask(checker,vp,{},true)).text);
      if(j&&j.ok===false&&lxA(j.erreurs).length){
        step("✍️ L'erreur restante est corrigée dans la version finale…");
        const fp=`${briefing}Version finale :\n${finalText}\n\nUn collègue signale encore : ${JSON.stringify(j.erreurs).slice(0,2500)}\nVérifie, corrige seulement ce qui est faux et réécris la version finale complète.`;
        try{const t=String((await ask(chef,fp)).text||'').trim();if(t)finalText=t}catch(e){}
      }
    }catch(e){}
  }
  /* 5. bilan : mission réussie ou non, classement */
  P.forEach(p=>agentResult(p.id,p.ok&&p.good!==false));
  const okCount=P.filter(p=>p.ok&&p.good!==false).length;
  const success=!!finalText&&okCount>=Math.ceil(P.length/2);
  const report={mission:M.titre,objectif:M.objectif,success,relais:!P[0].ok,
    agents:P.map(p=>({id:p.id,label:p.label,role:p.role,chef:p===chef,ok:p.ok&&p.good!==false,note:p.note==null?null:p.note,graves:p.graves||0,
      err:p.ok?(p.good===false?(p.err||(p.graves?`${p.graves} erreur${p.graves>1?'s':''} grave${p.graves>1?'s':''} trouvée${p.graves>1?'s':''}`:`jugé insuffisant (${p.note}/10)`)):''):(p.err||"n'a pas répondu")}))};
  const team=P.map(p=>({ia:p.label,role:p.role,ok:p.ok,text:p.ok?p.text:'⚠️ '+(p.err||'')}));
  return{text:finalText,team,report};
}
function missionReportHtml(rep){
  if(!rep)return '';
  return `<div class="mreport ${rep.success?'win':'lose'}"><div class="row" style="gap:8px;align-items:center;flex-wrap:wrap"><b>${rep.success?'Mission réussie':'Mission non réussie'}</b>${rep.relais?'<span class="tag">relais</span>':''}</div><p class="meta" style="margin:4px 0 8px">${esc(rep.objectif)}</p>
  <ul class="list">${rep.agents.map((a,i)=>`<li class="item" style="padding:6px 10px"><span>${iconSvg(a.ok?'check-circle':'x-circle')}</span><div class="grow"><b>${esc(dnIA(a.label,i,a.role))}</b>${a.chef?' <span class="tag">chef</span>':''}<div class="meta">${a.err?esc(a.err):a.note!=null?`Relu par un collègue : ${a.note}/10`:'Travail rendu'}</div></div>${a.ok?'<span class="tag">Réussi</span>':'<span class="tag loser">Loser</span>'}</li>`).join('')}</ul>
  ${rep.success?'':`<p class="info" style="margin:8px 0 0">L'équipe n'a pas atteint son objectif. Vérifie toi-même les points importants ou réessaie.</p>`}</div>`}

/* --- le binôme relit et relaie sur tous les programmes --- */
const relayable=e=>!!e&&['rate_limited','overloaded','upstream'].includes(e.code);
const duoActive=()=>aiCfg().duoAll!==false&&hasMainKey()&&!!duoAgent();
function inputText(input){if(typeof input==='string')return input;return (input||[]).slice(-6).map(m=>`${m.role==='assistant'?'IA':'Élève'} : ${m.content}`).join('\n')}
function toMsgs(input){if(typeof input==='string')return [{role:'user',content:input}];const m=(input||[]).map(x=>({role:x.role==='assistant'?'assistant':'user',content:String(x.content)}));while(m.length&&m[0].role!=='user')m.shift();return m.length?m:[{role:'user',content:'Bonjour'}]}
function withCorrections(input,corr){if(typeof input==='string')return input+'\n\n'+corr;const a=(input||[]).map(x=>({...x}));if(a.length)a[a.length-1].content=String(a[a.length-1].content)+'\n\n'+corr;return a}
async function relayText(input,opts,err){
  const d=duoAgent();if(!d)throw err;agentResult('main',false);
  const r=await callAgent(d,toMsgs(input)),t=String(r.text||'').trim();
  if(!t){agentResult(d.id,false);throw err}
  agentResult(d.id,true);toast('IA principale indisponible : le binôme prend le relais');
  if(opts&&opts.onText)opts.onText({text:t,delta:t});return{text:t}}
async function relayJson(input,opts,err){
  const d=duoAgent();if(!d)throw err;agentResult('main',false);
  const r=await callAgent(d,toMsgs(withCorrections(input,'Réponds uniquement avec un objet JSON valide, sans texte autour.')));
  const j=parseLoose(r.text);
  if(j==null){agentResult(d.id,false);throw aiError('bad_json')}
  agentResult(d.id,true);toast('IA principale indisponible : le binôme prend le relais');return j}
async function duoReview(base,input,r,opts,isJson){
  const d=duoAgent();if(!d)return null;
  const ans=isJson?JSON.stringify(r):String(r.text||'');
  if(ans.length<300)return null; // petites réponses (couleurs, listes courtes…) : pas la peine
  let rv;
  try{
    const t=(await callAgent(d,[{role:'system',content:"Tu es relecteur dans une équipe d'IA. Ta mission : repérer les erreurs réelles (faits, calculs, logique, consignes non respectées) dans la réponse d'un collègue. Sois précis et ne signale que de vrais problèmes."},{role:'user',content:`DEMANDE :\n${inputText(input).slice(0,6000)}\n\nRÉPONSE À VÉRIFIER :\n${ans.slice(0,9000)}\n\nRéponds uniquement en JSON : {"note":nombre de 0 à 10,"erreurs":[{"ou":"...","probleme":"...","correction":"...","grave":true ou false}]}`}])).text;
    rv=parseLoose(t);
  }catch(e){agentResult(d.id,false);return null}
  if(!rv)return null;
  agentResult(d.id,true);
  const graves=lxA(rv.erreurs).filter(x=>x&&(x.grave===true||x.grave==='true')),note=parseFloat(rv.note);
  const bad=graves.length>0||(isFinite(note)&&note<6);
  agentResult('main',!bad);
  if(!bad)return null;
  const corr=`Un relecteur a signalé ces erreurs possibles dans ta réponse :\n${JSON.stringify(rv.erreurs).slice(0,3000)}\nVérifie chacune toi-même ; corrige seulement celles qui sont justes et redonne la réponse complète, au même format.`;
  try{return isJson?await base.json(withCorrections(input,corr),opts):await base(withCorrections(input,corr),opts)}catch(e){return null}}
async function duoText(base,input,opts){
  opts=opts||{};const plain=!opts.tools&&!opts.images;let r;
  try{r=await base(input,opts)}catch(e){if(plain&&relayable(e)&&duoAgent())return relayText(input,opts,e);throw e}
  if(!plain||!duoActive()||!r||!String(r.text||'').trim())return r;
  return (await duoReview(base,input,r,opts,false))||r}
async function duoJson(base,input,opts){
  opts=opts||{};const plain=!opts.images;let r;
  try{r=await base.json(input,opts)}catch(e){if(plain&&relayable(e)&&duoAgent())return relayJson(input,opts,e);throw e}
  if(!plain||!duoActive()||r==null)return r;

async function claudeCall(input,opts,json){
  opts=opts||{};const msgs=[];
  const add=(role,text)=>{const l=msgs[msgs.length-1];if(l&&l.role===role)l.content.push({type:'text',text});else msgs.push({role,content:[{type:'text',text}]})};
  if(typeof input==='string')add('user',input);else input.forEach(m=>add(m.role==='assistant'?'assistant':'user',String(m.content)));
  while(msgs.length&&msgs[0].role!=='user')msgs.shift();
  if(!msgs.length)add('user','Bonjour');
  const lastUser=[...msgs].reverse().find(m=>m.role==='user');
  if(opts.images&&opts.images.length)for(const b of [...opts.images].reverse())lastUser.content.unshift({type:'image',source:{type:'base64',media_type:/^image\/(jpeg|png|webp|gif)$/.test(b.type)?b.type:'image/jpeg',data:await blobToB64(b)}});
  if(json)lastUser.content.push({type:'text',text:'\n\nRéponds uniquement avec un objet JSON valide, sans aucun texte autour et sans balises de code.'});
  const tools=opts.tools||[];
  const body={model:aiCfg().claudeModel||CLAUDE_MODELS[0][0],max_tokens:8000,messages:msgs};
  if(tools.length)body.tools=tools.map(t=>({name:t.name,description:t.description||'',input_schema:t.inputSchema||{type:'object',properties:{}}}));
  else if(opts.search)body.tools=[{type:'web_search_20250305',name:'web_search',max_uses:3}];
  let full='',model=body.model,search=!!opts.search&&!tools.length;const sources=[];
  for(let round=0;round<12;round++){
    let r;
    for(let attempt=0;;attempt++){
      const before=full;
      try{r=await claudeStream({...body,model},d=>{full+=d;opts.onText&&opts.onText({text:full,delta:d})});break}
      catch(e){full=before;
        if((e.code==='rate_limited'||e.code==='overloaded')&&attempt===0&&aiCfg().fallback!==false&&model!==CLAUDE_LIGHT){model=CLAUDE_LIGHT;continue}
        if(e.code==='overloaded'&&attempt<=1){await new Promise(x=>setTimeout(x,2500));continue}
        if(search&&body.tools&&!tools.length&&e.code==='upstream'&&/web.?search|tool/i.test(String(e.message))){delete body.tools;search=false;continue} // recherche web non activée sur ce compte : on répond sans
        throw e}}
    claudeCount(r.usage);
    for(const b of r.blocks)if(b.type==='web_search_tool_result'&&Array.isArray(b.content))b.content.forEach(x=>{if(x&&x.url&&!sources.some(s=>s.uri===x.url))sources.push({uri:x.url,title:x.title||x.url})});
    const clean=r.blocks.map(claudeClean).filter(b=>!(b.type==='text'&&!b.text));
    if(r.stop==='pause_turn'&&clean.length){body.messages.push({role:'assistant',content:clean});continue}
    const calls=r.blocks.filter(b=>b.type==='tool_use');
    if(!calls.length||r.stop!=='tool_use')break;
    body.messages.push({role:'assistant',content:clean});
    const out=[];
    for(const c of calls){const t=tools.find(x=>x.name===c.name);let res;
      try{res=t?await t.execute(c.input||{}):{erreur:'outil inconnu'}}catch(e){res={erreur:String(e&&e.message||e)}}
      out.push({type:'tool_result',tool_use_id:c.id,content:JSON.stringify({resultat:res===undefined?null:res})})}
    body.messages.push({role:'user',content:out});
    if(full&&!/\n$/.test(full))full+='\n\n';
  }
  let text=full.trim();
  if(search&&sources.length)text+='\n\n## Sources\n'+sources.slice(0,6).map(x=>`- ${x.title} : ${x.uri}`).join('\n');
  return{text,sources}}

const TEX_G='((?:[^{}]|\\{(?:[^{}]|\\{[^{}]*\\})*\\})*)';
function texConv(t){
  let s=String(t);
  s=s.replace(/\\begin\{[^}]*\}|\\end\{[^}]*\}/g,' ');
  for(let k=0;k<4&&/\\(?:text|mathrm|textbf|mathbf|mathit|textit|operatorname|mbox|boldsymbol|textrm|mathsf)\s*\{/.test(s);k++)

/* ---------- logique : Attrape-éclairs ---------- */
function catchInit(rng,H){return{W:360,H:H||640,x:180,tx:180,items:[],t:0,spawn:.5,n:0,score:0,bolts:0,lives:3,combo:0,over:false,rng:rng||Math.random,ev:[]}}
const catchMult=s=>Math.min(5,1+Math.floor(s.combo/5));
function catchStep(s,dt){
  if(s.over)return;s.ev.length=0;s.t+=dt;
  s.x+=(s.tx-s.x)*Math.min(1,dt*14);s.x=Math.max(30,Math.min(s.W-30,s.x));
  s.spawn-=dt;
  if(s.spawn<=0){
    const lvl=Math.min(1,s.t/80),r=s.rng(),kind=s.n<3?'bolt':r<.17+.12*lvl?'bad':r<.23+.12*lvl?'star':'bolt';
    s.items.push({k:kind,x:22+s.rng()*(s.W-44),y:-24,vy:150+120*lvl+s.rng()*60,rot:s.rng()*6.28});s.n++;
    s.spawn=.8-.42*lvl+s.rng()*.25}
  const y0=s.H-112,y1=s.H-34;
  for(let i=s.items.length-1;i>=0;i--){
    const it=s.items[i];it.y+=it.vy*dt;it.rot+=dt*3;
    if(Math.abs(it.x-s.x)<34&&it.y>y0&&it.y<y1){
      s.items.splice(i,1);
      if(it.k==='bad'){s.lives--;s.combo=0;s.ev.push({t:'bad',x:it.x,y:it.y})}
      else if(it.k==='star'){s.score+=5*catchMult(s);s.combo++;s.ev.push({t:'star',x:it.x,y:it.y})}
      else{s.score+=catchMult(s);s.bolts++;s.combo++;s.ev.push({t:'bolt',x:it.x,y:it.y})}
      if(s.lives<=0){s.over=true;s.ev.push({t:'over'})}
    }else if(it.y>s.H+30)s.items.splice(i,1)}}

const JVX=64,JVW=58;
function jumpInit(rng,H){H=H||640;return{W:360,H,gy:Math.round(H*.72),hy:0,vy:0,air:false,obs:[],dist:0,t:0,next:300,over:false,rng:rng||Math.random,ev:[],jumps:0,score:0}}

function jumpPress(s){if(!s.air&&!s.over){s.vy=760;s.air=true;s.jumps++;s.ev.push({t:'jump'})}}
function jumpStep(s,dt){

  const sp=jumpSpeed(s);s.dist+=sp*dt;

  s.next-=sp*dt;

    s.obs.push({k:t.k,w:t.w,h:t.h,x:s.W+30});s.next=sp*.69+120+s.rng()*170+t.w}

/* ================= Lisibilité : le texte s'adapte à la couleur de chaque matière ================= */
function cssRGB(c){let m=String(c).match(/rgba?\(([^)]+)\)/);if(m){const p=m[1].split(',').map(parseFloat);return[p[0],p[1],p[2]]}m=String(c).match(/color\(srgb ([\d.]+) ([\d.]+) ([\d.]+)/);if(m)return[m[1]*255,m[2]*255,m[3]*255];return null}
const relLum=([r,g,b])=>{const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(r)+.7152*f(g)+.0722*f(b)};
function inkFor(bg){const c=cssRGB(bg);if(!c)return null;const L=relLum(c),dark=(L+.05)/(.0156+.05),light=1.05/(L+.05);return dark>light?'#10261C':'#FFFFFF'}
/* garde-fou : tout bouton ou bloc coloré dont le texte serait peu lisible (thème choisi, couleur de matière…) prend une encre claire ou foncée */
function inkBlocks(){
  document.querySelectorAll('#main [style*="--c:"],#main button,#main .tag,#main .mchip').forEach(e=>{
    const s=getComputedStyle(e),bg=cssRGB(s.backgroundColor),fg=cssRGB(s.color);
    if(!bg||/rgba\([^)]*,\s*0(\.0+)?\)$/.test(s.backgroundColor)||(s.backgroundImage&&s.backgroundImage!=='none'))return;
    if(/rgba\([^)]*,\s*0\.[0-5]\d*\)$/.test(s.backgroundColor))return;
    const L1=relLum(bg),L2=fg?relLum(fg):0,ratio=(Math.max(L1,L2)+.05)/(Math.min(L1,L2)+.05);
    if(ratio<4.5){
      const k=inkFor(s.backgroundColor);if(!k)return;e.style.setProperty('color',k,'important');
      /* si ni le blanc ni le foncé ne suffisent, on fonce (ou éclaircit) un peu le fond, juste ce qu'il faut */
      const white=k==='#FFFFFF',inkL=white?1:relLum([16,38,28]),cr=c=>{const L=relLum(c);return (Math.max(L,inkL)+.05)/(Math.min(L,inkL)+.05)};
      if(cr(bg)<4.5){for(let t=.06;t<=.5;t+=.04){const c=bg.map(v=>white?v*(1-t):v+(255-v)*t);if(cr(c)>=4.5){e.style.setProperty('background-color',`rgb(${c.map(Math.round).join(',')})`,'important');break}}}}})}

  for(let w=0;w<weeks;w++)for(let d=0;d<7;d++){

{id:'resistance',t:'La résistance',sim:'led',c:`## À quoi ça sert
Une résistance **limite le courant** et crée une chute de tension. Elle transforme une partie de l'énergie en chaleur.
## La loi d'Ohm
La tension à ses bornes est proportionnelle au courant : U = R × I (U en volts, R en ohms Ω, I en ampères).
## Puissance
Elle chauffe : P = U × I = R × I². Choisis une résistance dont la puissance maximale (1/4 W, 1/2 W…) est supérieure à celle dissipée.
## Associations
- En série, les valeurs s'additionnent : Req = R1 + R2.
- En parallèle, la résistance équivalente est plus petite que la plus petite : Req = (R1 × R2) / (R1 + R2).
## Le code couleur
Les anneaux donnent la valeur : jaune-violet-rouge = 47 × 100 = 4,7 kΩ. Le Labo d'électronique décode les couleurs pour toi.`,

["Deux résistances de 1 kΩ en parallèle font :",['2 kΩ','500 Ω','1 kΩ','250 Ω'],1,"Deux résistances égales en parallèle : R / 2 = 500 Ω."],

["Anneaux marron-noir-orange :",['10 Ω','1 kΩ','10 kΩ','100 kΩ'],2,"Marron = 1, noir = 0, orange = × 1000 : 10 × 1000 = 10 kΩ."]]},
{id:'condensateur',t:'Le condensateur',sim:'rc',c:`## À quoi ça sert
Un condensateur **stocke des charges électriques**. Il sert à filtrer (lisser une tension), découpler une alimentation, créer des temporisations, et laisser passer les signaux alternatifs en bloquant le continu.
## Grandeurs
Sa capacité C se mesure en farads (F), en pratique en µF, nF ou pF. La charge stockée vaut Q = C × U et l'énergie W = ½ × C × U².
## Charge à travers une résistance
Avec une résistance R, la constante de temps vaut τ = R × C. Après τ, le condensateur est chargé à environ 63 % ; après 5τ, à plus de 99 % : on le considère chargé.
## Attention
Les condensateurs **électrolytiques sont polarisés** : respecte le + et le −, sinon ils peuvent gonfler ou exploser. Ne dépasse jamais la tension indiquée.
## Associations
En parallèle, les capacités s'additionnent ; en série, 1/Ceq = 1/C1 + 1/C2 (l'inverse des résistances).`,

["Au bout de combien de τ considère-t-on le condensateur chargé ?",['1τ','2τ','5τ','10τ'],2,"Après 5τ, il est chargé à plus de 99 %."],
["Un condensateur électrolytique est :",['non polarisé','polarisé','une résistance variable','une diode'],1,"Il faut respecter le sens + / − indiqué sur le boîtier."],
["Deux condensateurs de 10 µF en parallèle donnent :",['5 µF','10 µF','20 µF','100 µF'],2,"En parallèle, les capacités s'additionnent : 10 + 10 = 20 µF."]]},
{id:'bobine',t:'La bobine (inductance)',c:`## À quoi ça sert
Une bobine est un fil enroulé. Elle **s'oppose aux variations du courant** : elle laisse passer le continu mais freine les changements rapides. On la trouve dans les filtres, les alimentations à découpage, les relais et les moteurs.
## Grandeurs
Son inductance L se mesure en henrys (H), souvent en mH ou µH. La tension à ses bornes vaut U = L × ΔI / Δt et l'énergie stockée W = ½ × L × I².
## Le danger à la coupure
Quand on coupe brusquement le courant d'une bobine (relais, moteur), elle produit une **surtension** qui peut détruire un transistor. On place une **diode de roue libre** en parallèle, en inverse, pour l'absorber.
## Avec un condensateur
Une bobine et un condensateur forment un circuit résonant (LC), base des filtres et des émetteurs radio.`,

['Semi-conducteurs',[
{id:'diode',t:'La diode et le redressement',c:`## Le principe
Une diode laisse passer le courant **dans un seul sens**, de l'anode (A) vers la cathode (K, repérée par un trait). Dans le sens passant, elle provoque une chute de tension d'environ **0,6 à 0,7 V** (diode au silicium).
## Le redressement
Pour transformer l'alternatif en continu :
- **simple alternance** : une seule diode, on ne garde que la moitié du signal ;
- **double alternance** avec un **pont de diodes** (pont de Graetz, 4 diodes) : on garde les deux alternances.
Un **condensateur de filtrage** lisse ensuite la tension (il reste une petite ondulation).
## Protection
Une diode protège contre l'inversion de polarité d'une alimentation et sert de roue libre sur les bobines.
## Modèles courants
1N4007 : redressement (1 A, 1000 V). 1N4148 : petits signaux rapides.`,
f:['Chute de tension : environ 0,7 V (silicium)','Pont de diodes : 2 diodes conduisent à chaque alternance (≈ 1,4 V de chute)'],

{id:'led_zener',t:'La LED et la diode Zener',sim:'led',c:`## La LED
Une LED est une diode qui **émet de la lumière**. Sa chute de tension dépend de la couleur : environ 1,8 à 2,2 V (rouge, jaune), 3 à 3,3 V (bleue, blanche). Une LED classique de 5 mm supporte en général **20 mA au maximum**.
Il faut **toujours une résistance en série** : R = (Vcc − Vled) / I. Exemple : 5 V, LED rouge 2 V, 15 mA → R = 3 / 0,015 = 200 Ω (on prend 220 Ω).
La patte la plus longue est l'anode (+).
## La diode Zener
Utilisée **en inverse**, elle maintient une tension presque constante, la tension Zener Vz (par exemple 5,1 V). On s'en sert pour une petite tension de référence ou pour protéger une entrée.

{id:'transistor',t:'Le transistor bipolaire',sim:'tr',c:`## Le principe
Un transistor bipolaire (NPN ou PNP) a trois pattes : **base (B), collecteur (C), émetteur (E)**. Un petit courant de base commande un courant de collecteur bien plus grand : Ic = β × Ib (β, le gain, vaut souvent 100 à 300).
## En commutation (interrupteur)
C'est l'usage le plus courant avec un microcontrôleur : la sortie du micro commande la base à travers une résistance, et le transistor allume une charge (LED, relais, moteur).
- **Bloqué** : Ib = 0, aucun courant ne passe.
- **Saturé** : le transistor est un interrupteur fermé, Vce ≈ 0,2 V.
Pour saturer à coup sûr, on prend Ib plus grand que Ic / β (souvent 2 à 5 fois).
## La résistance de base
Rb = (Vcommande − 0,7) / Ib.
## Modèles courants
2N2222 ou BC547 (NPN, petits courants), TIP120 (Darlington, plusieurs ampères).`,

{id:'mosfet',t:'Le MOSFET',c:`## Le principe
Un MOSFET se commande **en tension**, pas en courant. Ses pattes sont la **grille (G), le drain (D) et la source (S)**. La grille ne consomme presque aucun courant en continu. Quand la tension grille-source dépasse le seuil, il conduit avec une très faible résistance Rds(on) : il chauffe peu.
## Pourquoi c'est pratique
Il commande de **forts courants** (moteurs, rubans LED, résistances chauffantes) avec une sortie de microcontrôleur.
## Les pièges
- Choisis un MOSFET **« logic level »** (IRLZ44N, IRL540…) pour le commander en 3,3 V ou 5 V. L'IRFZ44N, lui, a besoin d'environ 10 V sur la grille pour bien conduire.
- Ajoute une **résistance de grille** (100 à 220 Ω environ) et une **résistance de tirage** vers la masse (10 kΩ environ) pour qu'il reste bloqué au démarrage.
- Avec un moteur ou un relais, mets une **diode de roue libre**.`,

["À quoi sert la résistance de 10 kΩ entre grille et masse ?",["À l'allumer",'À le garder bloqué quand rien ne le commande','À limiter le courant du moteur','À faire une LED'],1,"Sans elle, la grille « flotte » et le MOSFET peut conduire au hasard."],

["Amplificateur opérationnel (AOP)",[
{id:'aop',t:"L'AOP : principe et montages",sim:'aop',c:`## Le principe
L'**amplificateur opérationnel** (AOP, par exemple LM358 ou TL081) a deux entrées, **+ (non inverseuse)** et **− (inverseuse)**, et une sortie. Il amplifie énormément la différence entre ses entrées. Avec une **contre-réaction** (une résistance de la sortie vers l'entrée −), il fonctionne en **régime linéaire** : le gain est fixé par les résistances.
## Les montages de base
- **Inverseur** : Vs = −(R2 / R1) × Ve. Le signal est amplifié et retourné.
- **Non inverseur** : Vs = (1 + R2 / R1) × Ve.
- **Suiveur** (sortie reliée à l'entrée −) : Vs = Ve. La tension ne change pas, mais le montage d'avant n'est pas « chargé ».
## La saturation
La sortie ne dépasse pas ses tensions d'alimentation : elle **sature** un peu en dessous (souvent 1 à 2 V de moins, sauf les AOP « rail-to-rail »). Si le calcul donne plus, le signal est écrêté.
## L'AOP idéal en linéaire
Aucun courant n'entre dans les entrées, et V+ = V−.`,
f:['Inverseur : Vs = −(R2 / R1) × Ve','Non inverseur : Vs = (1 + R2 / R1) × Ve','Suiveur : Vs = Ve','Idéal en linéaire : V+ = V−, i+ = i− = 0'],
q:[["Inverseur avec R1 = 10 kΩ et R2 = 47 kΩ, Ve = 0,5 V. Vs ?",['−2,35 V','2,35 V','−4,7 V','2,85 V'],0,"Vs = −(47 / 10) × 0,5 = −2,35 V."],
["Non inverseur avec R1 = 10 kΩ et R2 = 90 kΩ. Gain ?",['9','10','−9','0,1'],1,"Gain = 1 + R2 / R1 = 1 + 9 = 10."],
["Alimenté en ±12 V, un gain de 10 avec Ve = 2 V donne :",['20 V','une sortie saturée, un peu sous +12 V','−20 V','2 V'],1,"Le calcul donne 20 V, impossible : la sortie sature un peu sous +12 V."],
["Le montage suiveur sert surtout à :",['amplifier × 10','isoler sans changer la tension','inverser le signal','redresser'],1,"Gain de 1, mais très forte impédance d'entrée : il ne « charge » pas le montage d'avant."]]},
{id:'comparateur',t:"L'AOP en comparateur",c:`## Le principe
Sans contre-réaction, l'AOP **compare** ses deux entrées :
- si V+ > V−, la sortie part au maximum (saturation haute) ;
- si V+ < V−, la sortie part au minimum (saturation basse, ou 0 V en alimentation simple).
## Exemple : allumer une lampe quand il fait nuit
On met une **LDR** dans un diviseur de tension sur une entrée, et une **tension de référence** réglée avec un potentiomètre sur l'autre. Quand la lumière baisse, la tension passe le seuil et la sortie bascule.
## Les basculements répétés
Si le signal tremble autour du seuil, la sortie oscille. On ajoute de l'**hystérésis** (deux seuils, comme un trigger de Schmitt) grâce à une résistance vers l'entrée +.
## Un vrai comparateur
Le LM393 a une sortie à collecteur ouvert : il faut une résistance de tirage vers +V.`,

["V+ = 3 V et V− = 2 V. La sortie est :",['haute','basse','à 1 V','à 0 V exactement'],0,"V+ > V− : la sortie part vers la saturation haute."],
["À quoi sert l'hystérésis ?",['À amplifier','À éviter les basculements répétés autour du seuil','À filtrer le 50 Hz','À augmenter la tension'],1,"Avec deux seuils différents, un petit bruit ne fait plus basculer la sortie."],
["Le LM393 a une sortie à collecteur ouvert. Il faut donc :",['une résistance de tirage','un condensateur','une bobine','rien de plus'],0,"Sans résistance de tirage vers +V, la sortie ne peut pas monter."]]}]],
['Logique et numération',[
{id:'logique',t:'Portes logiques et algèbre de Boole',c:`## Les portes de base
- **ET (AND)** : sortie à 1 seulement si toutes les entrées sont à 1.
- **OU (OR)** : sortie à 1 si au moins une entrée est à 1.
- **NON (NOT)** : inverse l'entrée.
- **NON-ET (NAND)** et **NON-OU (NOR)** : ET et OU suivis d'un NON.
- **OU exclusif (XOR)** : sortie à 1 si les entrées sont différentes.
Le Labo d'électronique affiche leurs tables de vérité.
## Algèbre de Boole
On écrit ET avec · , OU avec + , NON avec une barre. Règles utiles : A · 1 = A, A + 0 = A, A · A̅ = 0, A + A̅ = 1.
## Les théorèmes de De Morgan
- NON(A · B) = A̅ + B̅
- NON(A + B) = A̅ · B̅
Ils permettent de simplifier et de tout construire avec des portes NAND seules (porte « universelle »).
## Circuits intégrés
74HC00 (4 NAND), 74HC08 (4 ET), 74HC32 (4 OU), 74HC04 (6 NON).`,
f:['NON(A · B) = A̅ + B̅','NON(A + B) = A̅ · B̅','A + A̅ = 1 ; A · A̅ = 0'],
q:[["Porte ET avec A = 1 et B = 0 :",['1','0','indéfini','2'],1,"ET donne 1 seulement si les deux entrées sont à 1."],
["Porte XOR avec A = 1 et B = 1 :",['1','0','2','impossible à dire'],1,"XOR donne 1 seulement si les entrées sont différentes."],
["NON(A + B) est égal à :",['A̅ + B̅','A̅ · B̅','A · B','A + B'],1,"Théorème de De Morgan : NON(A + B) = A̅ · B̅."],
["Quelle porte est dite universelle ?",['XOR','NAND','OU','NON'],1,"Avec des NAND seules, on peut fabriquer toutes les autres portes."]]},
{id:'numeration',t:'Binaire et hexadécimal',c:`## Pourquoi le binaire ?
Un circuit numérique ne connaît que deux états : 0 et 1. Un **bit** vaut 0 ou 1 ; un **octet** = 8 bits, soit 256 valeurs (0 à 255).
## Binaire vers décimal
Chaque rang vaut une puissance de 2 : 1, 2, 4, 8, 16, 32, 64, 128. Exemple : 1011 = 8 + 0 + 2 + 1 = 11.
## Décimal vers binaire
On divise par 2 et on garde les restes, lus de bas en haut : 13 donne 1101.
## L'hexadécimal
Base 16 : 0 à 9 puis A (10) à F (15). Un chiffre hexa = 4 bits. Exemple : 0x7E = 0111 1110 = 126. C'est très utilisé en programmation (adresses, couleurs #FF8800).
## Avec un microcontrôleur
Un convertisseur de 10 bits donne 2¹⁰ = 1024 valeurs (0 à 1023) ; 12 bits donnent 4096 valeurs.
Le Labo d'électronique convertit pour toi.`,

["0xFF en décimal :",['15','100','255','256'],2,"F = 15 : 15 × 16 + 15 = 255."],
["Combien de valeurs avec 10 bits ?",['100','512','1024','2048'],2,"2¹⁰ = 1024 valeurs, de 0 à 1023."],
["13 en binaire :",['1101','1011','1110','0111'],0,"8 + 4 + 1 = 13, donc 1101."]]}]]];
ACAD.push(['Microcontrôleurs',[
{id:'micro',t:'Le microcontrôleur (Arduino, ESP32)',c:`## Qu'est-ce que c'est ?
C'est un **petit ordinateur sur une seule puce** : processeur, mémoire et entrées-sorties. On le programme pour lire des capteurs et commander des actionneurs.
## Deux cartes très utilisées
- **Arduino Uno** (ATmega328P) : logique **5 V**, 14 broches numériques dont 6 en PWM, 6 entrées analogiques (convertisseur 10 bits : 0 à 1023). Simple et robuste.
- **ESP32** : logique **3,3 V**, Wi-Fi et Bluetooth intégrés, plus rapide, convertisseur 12 bits (0 à 4095). Parfait pour les objets connectés. Ne mets jamais 5 V sur ses broches.
## La structure d'un programme Arduino
- setup() s'exécute une fois au démarrage (configuration) ;
- loop() se répète sans fin.
## Le courant des broches
Une broche ne fournit que **quelques dizaines de mA au maximum** (environ 20 mA conseillés sur l'Uno). Pour un moteur, un relais ou beaucoup de LED, passe par un **transistor** ou un module.`,
f:['Arduino Uno : 5 V, ADC 10 bits (0 à 1023)','ESP32 : 3,3 V, ADC 12 bits (0 à 4095)'],
q:[["La fonction qui se répète sans fin dans un programme Arduino :",['setup()','loop()','main()','start()'],1,"setup() s'exécute une fois, loop() en boucle."],
["L'ESP32 fonctionne en logique :",['5 V','12 V','3,3 V','1,5 V'],2,"3,3 V : mettre 5 V sur ses broches peut l'abîmer."],
["Pour commander un moteur avec une broche d'Arduino :",['on le branche directement','on passe par un transistor ou un module','on met une LED','on met un condensateur'],1,"Une broche ne fournit que quelques dizaines de mA : trop peu pour un moteur."],
["Le convertisseur analogique de l'Uno donne des valeurs de :",['0 à 255','0 à 1023','0 à 4095','0 à 100'],1,"10 bits : 1024 valeurs, de 0 à 1023."]]},
{id:'gpio_pwm',t:'Entrées, sorties, PWM et ADC',sim:'pwm',c:`## Les sorties numériques
pinMode(13, OUTPUT) puis digitalWrite(13, HIGH) met la broche à 5 V (3,3 V sur ESP32) ; LOW la met à 0 V.
## Les entrées numériques
digitalRead(2) lit 0 ou 1. Un bouton a besoin d'une **résistance de tirage** (pull-up ou pull-down), sinon l'entrée « flotte ». INPUT_PULLUP active celle intégrée : le bouton relie alors la broche à la masse, donc appuyé = LOW.
## Les entrées analogiques (ADC)
analogRead(A0) renvoie 0 à 1023 sur l'Uno. Tension = valeur × 5 / 1023.
## La PWM
La **modulation de largeur d'impulsion** fait varier le rapport cyclique α d'un signal carré. La tension moyenne vaut α × Vcc : analogWrite(9, 128) donne environ 50 %, soit à peu près 2,5 V en moyenne. Elle sert à varier la luminosité d'une LED ou la vitesse d'un moteur. Essaie la simulation PWM.`,

["PWM à 25 % sur 5 V : tension moyenne ?",['1,25 V','2,5 V','3,75 V','5 V'],0,"Vmoy = 0,25 × 5 = 1,25 V."],
["Pourquoi une résistance de tirage sur une entrée ?",["Pour éviter que l'entrée flotte",'Pour amplifier','Pour la PWM',"Pour l'ADC"],0,"Sans elle, l'entrée capte le bruit et lit 0 ou 1 au hasard."]]},
{id:'bus',t:'Communication : UART, I2C, SPI',c:`## UART (liaison série)
Deux fils croisés : **TX** de l'un vers **RX** de l'autre, plus la masse commune. Les deux côtés doivent avoir la même vitesse (9600 ou 115200 bauds par exemple). C'est ce qu'utilise le Moniteur série : Serial.begin(9600).
## I2C
Deux fils partagés : **SDA** (données) et **SCL** (horloge), avec des résistances de tirage. Chaque module a une **adresse** (souvent 0x27 pour les écrans LCD I2C) : on en branche plusieurs sur les mêmes fils. Idéal pour les écrans, capteurs et horloges.
## SPI
Quatre fils : **MOSI, MISO, SCK** et **CS** (un CS par module). Plus rapide que l'I2C : cartes SD, écrans couleur, modules radio.
## Toujours
Relie les masses (GND) ensemble, et vérifie les niveaux de tension (3,3 V ou 5 V) avant de brancher.`,

["Les deux fils de l'I2C sont :",['TX et RX','SDA et SCL','MOSI et MISO','VCC et GND'],1,"SDA pour les données, SCL pour l'horloge."],
["Comment plusieurs modules I2C partagent-ils les mêmes fils ?",['Chacun a une adresse','Chacun a un fil CS','Ils parlent au hasard','C\'est impossible'],0,"L'adresse (par exemple 0x27) désigne le module voulu."],

ACAD.push(['Capteurs et modules',[
{id:'capteurs',t:'Capteurs courants (LDR, DHT11, HC-SR04)',c:`## La photorésistance (LDR)
Sa résistance **baisse quand la lumière augmente** (des centaines de kΩ dans le noir, quelques kΩ ou moins en plein jour). On la place dans un **diviseur de tension** avec une résistance fixe pour obtenir une tension lue par une entrée analogique.
## Le DHT11 (température et humidité)
Capteur numérique sur un seul fil de données : de 0 à 50 °C (±2 °C) et de 20 à 80 % d'humidité (±5 %). Le DHT22 est plus précis. Il faut une bibliothèque, et ne pas le lire trop souvent (une fois par seconde pour le DHT11).
## Le HC-SR04 (distance par ultrasons)
On envoie une impulsion sur TRIG et on mesure la durée du signal ECHO. Le son fait l'aller-retour : distance = durée × 340 m/s ÷ 2, soit **d (cm) ≈ durée (µs) ÷ 58**. Portée d'environ 2 cm à 4 m. Il fonctionne en 5 V : sur un ESP32, abaisse le signal ECHO avec un diviseur de tension.
## Autres capteurs
Détecteur de mouvement PIR, thermistance (CTN), potentiomètre, capteur de gaz MQ.`,

{id:'modules',t:'Modules : relais et écran LCD I2C',c:`## Le module relais
Un relais est un **interrupteur commandé par une bobine** : un microcontrôleur peut allumer un appareil d'une autre tension (lampe, pompe), avec une **isolation** entre les deux circuits. Les modules intègrent le transistor, la diode de roue libre et souvent une LED. Bornes : **COM** (commun), **NO** (normalement ouvert), **NC** (normalement fermé). Certains modules s'activent quand l'entrée est à LOW.
Le 220 V est **dangereux** : ne le manipule qu'avec un adulte qualifié, dans un boîtier fermé.
## L'écran LCD 16x2 en I2C
Avec un adaptateur I2C (adresse souvent 0x27 ou 0x3F), quatre fils suffisent : VCC, GND, SDA, SCL. Le petit potentiomètre bleu règle le **contraste** : si rien ne s'affiche, tourne-le d'abord.
## Autres modules
Écran OLED, Bluetooth HC-05, horloge RTC DS3231, carte SD, driver de moteur L298N.`,

ACAD.push(['Actionneurs',[
{id:'moteurs',t:'Moteur à courant continu et pont en H',sim:'pwm',c:`## Le moteur à courant continu
Sa **vitesse dépend de la tension** et son **sens de la polarité**. Il consomme beaucoup de courant, surtout au démarrage ou bloqué : on ne le branche jamais directement sur une broche.
## Varier la vitesse
On utilise la **PWM** à travers un transistor ou un MOSFET, avec une diode de roue libre.
## Changer le sens : le pont en H
Quatre interrupteurs (transistors) permettent d'inverser le courant dans le moteur. Les modules **L298N** (2 moteurs, environ 2 A par voie) ou **TB6612FNG** (plus efficace) l'intègrent. On les commande avec deux broches de sens (IN1, IN2) et une broche PWM (ENA) pour la vitesse.
## Bonnes pratiques
Alimente les moteurs avec une **source séparée** (batterie), mais relie les masses. Un condensateur céramique de 100 nF aux bornes du moteur réduit les parasites.`,

q:[["Pour inverser le sens d'un moteur à courant continu :",['on inverse la polarité','on baisse la tension','on ajoute une LED','on change la fréquence'],0,"Inverser + et − change le sens de rotation : c'est le rôle du pont en H."],
["Le L298N est :",['un capteur','un pont en H pour 2 moteurs','un régulateur','un écran'],1,"Il pilote deux moteurs dans les deux sens."],
["On varie la vitesse d'un moteur avec :",['la PWM',"l'I2C",'une diode Zener','un relais seul'],0,"La PWM change la tension moyenne, donc la vitesse."],
["Pourquoi relier les masses des deux alimentations ?",['Pour décorer','Pour que les signaux de commande aient une référence commune','Pour doubler la tension',"Ce n'est pas utile"],1,"Sans masse commune, les signaux de commande n'ont pas de référence."]]},
{id:'servo_pap',t:'Servomoteur et moteur pas à pas',c:`## Le servomoteur
Il tourne à un **angle précis** (souvent de 0 à 180°). Trois fils : alimentation (rouge), masse (marron ou noir), signal (orange ou jaune). On le commande avec une impulsion répétée toutes les **20 ms (50 Hz)** : environ 1 ms pour 0°, 1,5 ms pour 90° et 2 ms pour 180°. Avec Arduino : bibliothèque Servo et servo.write(90). Les servos « 360° » tournent en continu : l'impulsion règle alors la vitesse et le sens.
## Le moteur pas à pas
Il avance par **pas** : un moteur de 200 pas par tour fait 1,8° par pas. Il est précis sans capteur (imprimantes 3D, CNC). Il lui faut un **driver** : ULN2003 pour le petit 28BYJ-48, A4988 ou DRV8825 pour les NEMA 17 (broches STEP et DIR).
## Choisir
Angle précis et petit effort : servo. Rotation précise : pas à pas. Rotation rapide : moteur à courant continu.`,

["Moteur pas à pas de 200 pas par tour : angle d'un pas ?",['0,9°','1,8°','3,6°','18°'],1,"360 / 200 = 1,8°."],

ACAD.push(['Alimentation',[
{id:'alim',t:'Alimentation et régulateur 7805',c:`## Le régulateur linéaire 7805
Il fournit **5 V stables** à partir d'une tension plus élevée. Il lui faut au moins **7 V environ** à l'entrée (2 V de plus que la sortie). Brochage vu de face : entrée, masse, sortie. Ajoute des condensateurs (par exemple 0,33 µF en entrée et 0,1 µF en sortie).
## Il chauffe
La puissance perdue vaut P = (Vin − Vout) × I. Avec 12 V en entrée et 0,5 A : (12 − 5) × 0,5 = 3,5 W, il faut un **radiateur**. Pour de gros écarts de tension, préfère un **convertisseur à découpage** (buck, par exemple LM2596), bien plus efficace.
## Les batteries
Une cellule lithium 18650 fait 3,7 V nominal (4,2 V chargée). Elle se charge avec un module dédié (TP4056) et ne doit jamais être court-circuitée. Une pile 9 V se vide vite avec des moteurs.
## Le 3,3 V
L'AMS1117-3.3 alimente un ESP32 à partir de 5 V.`,

ACAD.push(['Fonctions électroniques',[
{id:'ne555',t:'Le NE555 (astable et monostable)',c:`## Le circuit
Le NE555 est un circuit intégré à 8 broches qui fabrique des **temporisations** et des **signaux carrés**. Il s'alimente de 4,5 à 16 V et sa sortie (broche 3) peut fournir jusqu'à environ 200 mA.
Brochage : 1 masse, 2 déclenchement (TRIG), 3 sortie, 4 remise à zéro (RESET, reliée au + si on ne s'en sert pas), 5 contrôle (un condensateur de 10 nF vers la masse), 6 seuil (THR), 7 décharge (DIS), 8 alimentation.
## Le montage astable (clignotant)
Avec R1, R2 et C, la sortie oscille sans arrêt :
- temps à l'état haut : th = 0,693 × (R1 + R2) × C ;
- temps à l'état bas : tb = 0,693 × R2 × C ;
- fréquence : f = 1,44 / ((R1 + 2 × R2) × C).
Le temps haut est toujours un peu plus long que le temps bas (rapport cyclique supérieur à 50 %).
## Le montage monostable (minuterie)
Une impulsion sur la broche 2 met la sortie à l'état haut pendant une durée fixe : T = 1,1 × R × C, puis elle revient à l'état bas.
## Exemple
R1 = 1 kΩ, R2 = 10 kΩ, C = 100 µF : f = 1,44 / (21 000 × 0,0001) ≈ 0,69 Hz, une LED clignote environ toutes les 1,5 s.`,
