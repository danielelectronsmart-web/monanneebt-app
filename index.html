q:[["La sortie du NE555 est sur la broche :",['1','3','5','8'],1,"Broche 3 : la sortie. La 1 est la masse et la 8 l'alimentation."],
["Astable avec R1 = 1 kΩ, R2 = 10 kΩ, C = 100 µF. Fréquence ?",['environ 0,69 Hz','environ 6,9 Hz','environ 1,44 Hz','environ 69 Hz'],0,"f = 1,44 / ((1 000 + 20 000) × 0,0001) = 1,44 / 2,1 ≈ 0,69 Hz."],
["Monostable avec R = 100 kΩ et C = 10 µF. Durée de l'impulsion ?",['0,11 s','1,1 s','11 s','0,69 s'],1,"T = 1,1 × 100 000 × 0,00001 = 1,1 s."],
["En astable classique, le temps haut est :",['plus court que le temps bas','égal au temps bas','plus long que le temps bas','nul'],2,"th dépend de R1 + R2 et tb de R2 seule : th est donc plus long."]]},
{id:'filtres',t:'Les filtres RC',sim:'filtre',c:`## Le principe
Un filtre laisse passer certaines fréquences et en atténue d'autres. Avec une résistance et un condensateur, on obtient les filtres les plus simples, du **premier ordre**.
## Fréquence de coupure
fc = 1 / (2π × R × C). À cette fréquence, le signal de sortie vaut environ **70,7 %** de l'entrée (gain de −3 dB).
## Passe-bas
R en série, puis C vers la masse ; on prend la sortie aux bornes de C. Il laisse passer les **basses fréquences** et atténue celles au-dessus de fc (environ 10 fois moins par décade, soit −20 dB par décade). Usage : lisser un signal PWM, supprimer un bruit rapide.
## Passe-haut
C en série, puis R vers la masse ; sortie aux bornes de R. Il laisse passer les **hautes fréquences** et bloque le continu. Usage : liaison entre deux étages d'amplification, suppression d'une tension continue.
## Exemple
R = 1,6 kΩ et C = 100 nF : fc = 1 / (2π × 1 600 × 0,0000001) ≈ 1 kHz.`,
f:['fc = 1 / (2π × R × C)','À fc : gain ≈ 0,707 (−3 dB)','Au-delà : −20 dB par décade (1er ordre)'],
q:[["R = 1,6 kΩ et C = 100 nF. Fréquence de coupure ?",['environ 100 Hz','environ 1 kHz','environ 10 kHz','environ 1 MHz'],1,"fc = 1 / (2π × 1 600 × 0,0000001) ≈ 995 Hz, soit environ 1 kHz."],
["À la fréquence de coupure, la sortie vaut environ :",["100 % de l'entrée","70,7 % de l'entrée","50 % de l'entrée","10 % de l'entrée"],1,"Gain de 1/√2 ≈ 0,707, soit −3 dB."],
["Pour lisser un signal PWM, on utilise un filtre :",['passe-haut','passe-bas','coupe-bande','aucun'],1,"Le passe-bas garde la valeur moyenne et supprime les commutations rapides."],
["Un filtre passe-haut :",['laisse passer le continu','bloque le continu','amplifie tout','ne fonctionne qu\'en numérique'],1,"Le condensateur en série bloque la tension continue."]]}]]);

ACAD.unshift(['Les bases',[
{id:'bases',t:'Tension, courant, puissance',c:`## La tension (U)
La tension est la « pression » électrique entre deux points. Elle se mesure en **volts (V)**, avec un voltmètre branché **en parallèle**. Une pile de 9 V a 9 V entre ses bornes.
## Le courant (I)
Le courant est le débit de charges électriques dans un circuit **fermé**. Il se mesure en **ampères (A)**, avec un ampèremètre branché **en série**. Par convention, il sort par la borne + du générateur.
## La résistance (R)
Elle s'oppose au passage du courant ; elle se mesure en **ohms (Ω)**. Les trois grandeurs sont liées par la loi d'Ohm : U = R × I.
[[sch:ohm|Un générateur et une résistance : le courant I circule, la tension U apparaît aux bornes de R]]
## Puissance et énergie
P = U × I, en watts (W). L'énergie consommée vaut E = P × t : en joules si t est en secondes, en wattheures (Wh) si t est en heures. Une lampe de 10 W allumée 5 h consomme 50 Wh.
## Les préfixes
- m (milli) = 0,001 ; µ (micro) = 0,000 001 ; n (nano) = 10⁻⁹ ; p (pico) = 10⁻¹²
- k (kilo) = 1 000 ; M (méga) = 1 000 000
Exemples : 4,7 kΩ = 4 700 Ω ; 20 mA = 0,02 A.`,
f:['U = R × I','P = U × I','E = P × t','1 mA = 0,001 A ; 1 kΩ = 1 000 Ω'],
q:[["Un appareil de 12 V consomme 0,5 A. Sa puissance ?",['6 W','24 W','12,5 W','0,04 W'],0,"P = U × I = 12 × 0,5 = 6 W."],
["2,2 kΩ vaut :",['22 Ω','220 Ω','2 200 Ω','22 000 Ω'],2,"k = × 1 000 : 2,2 × 1 000 = 2 200 Ω."],
["Un voltmètre se branche :",['en série','en parallèle','à la place du générateur','hors du circuit'],1,"Il mesure une différence de tension entre deux points : en parallèle."],
["Une lampe de 60 W allumée 2 h consomme :",['30 Wh','62 Wh','120 Wh','0,12 Wh'],2,"E = P × t = 60 × 2 = 120 Wh."]]},
{id:'alternatif',t:'Le courant alternatif',c:`## Continu et alternatif
Une pile donne une tension **continue** (toujours dans le même sens). Le secteur donne une tension **alternative** : elle change de sens en permanence, en suivant une courbe sinusoïdale.
[[sch:sinus|Tension sinusoïdale : valeur maximale, valeur efficace et période]]
## Période et fréquence
La **période T** est la durée d'un cycle complet, en secondes. La **fréquence** f est le nombre de cycles par seconde, en hertz (Hz) : f = 1 / T. Le secteur en Côte d'Ivoire est à **50 Hz**, soit T = 20 ms.
## Valeur maximale et valeur efficace
La valeur efficace produit le même échauffement qu'une tension continue de même valeur. Pour une sinusoïde : Ueff = Umax / √2 ≈ 0,707 × Umax. Les 230 V du secteur sont une valeur efficace : la valeur maximale atteint environ 325 V. Un multimètre en position « V~ » affiche la valeur efficace.
## Sécurité
Le secteur 230 V peut tuer. On ne travaille jamais dessus sous tension, et seulement avec une personne qualifiée.`,
f:['f = 1 / T','Ueff = Umax / √2 ≈ 0,707 × Umax','Secteur : 230 V efficaces, 50 Hz'],
q:[["Fréquence 50 Hz : période ?",['2 ms','20 ms','50 ms','0,5 s'],1,"T = 1 / 50 = 0,02 s = 20 ms."],
["Umax = 17 V. Ueff ?",['8,5 V','12 V','17 V','24 V'],1,"Ueff = 17 / √2 ≈ 12 V."],
["Un multimètre en « V~ » sur le secteur affiche environ :",['325 V','230 V','50 V','110 V'],1,"Il affiche la valeur efficace : 230 V."],
["Une tension continue :",['change de sens 50 fois par seconde','garde toujours le même sens','vaut toujours 230 V','est sinusoïdale'],1,"Continue : toujours dans le même sens (pile, batterie)."]]},
{id:'kirchhoff',t:'Les lois de Kirchhoff',c:`## La loi des nœuds
Un **nœud** est un point où se rejoignent au moins trois fils. La somme des courants qui arrivent dans un nœud est égale à la somme des courants qui en repartent : rien ne se perd.
[[sch:noeud|Loi des nœuds : I1 + I2 = I3 + I4]]
## La loi des mailles
Une **maille** est un chemin fermé dans un circuit. En faisant le tour d'une maille, la somme des tensions (comptées avec leur sens) est nulle : la tension du générateur se partage entre les récepteurs, E = U1 + U2 + …
## En série et en parallèle
- En série, le **courant est le même** partout et les tensions s'additionnent.
- En parallèle, la **tension est la même** aux bornes de chaque branche et les courants s'additionnent.
[[sch:serie|Résistances en série et en parallèle]]
## Exemple
Une pile de 9 V alimente deux résistances en série ; on mesure 4 V aux bornes de la première. La seconde a donc 9 − 4 = 5 V à ses bornes.`,
f:['Nœud : courants entrants = courants sortants','Maille : E = U1 + U2 + …'],
q:[["Deux courants de 2 A et 3 A arrivent dans un nœud ; un seul fil en repart. Son courant ?",['1 A','5 A','6 A','1,5 A'],1,"Loi des nœuds : 2 + 3 = 5 A."],
["12 V alimentent deux résistances en série ; 7 V aux bornes de la première. La seconde ?",['7 V','5 V','19 V','12 V'],1,"Loi des mailles : 12 − 7 = 5 V."],
["Dans des branches en parallèle, ce qui est identique, c'est :",['le courant','la tension','la résistance','la puissance'],1,"Toutes les branches sont reliées aux mêmes deux points : même tension."],
["Dans un circuit en série, le courant :",['est le même partout','se divise','est nul','double à chaque composant'],0,"Il n'y a qu'un seul chemin : le même courant traverse tout."]]},
{id:'mesure',t:'Mesurer : multimètre et oscilloscope',c:`## Le multimètre
- **Voltmètre (V)** : en **parallèle** sur le composant. Choisis V⎓ (continu) ou V~ (alternatif).
- **Ampèremètre (A)** : en **série**, en ouvrant le circuit, avec le fil rouge dans la bonne borne (mA ou 10 A). Ne le branche **jamais** directement sur une source : c'est un court-circuit.
- **Ohmmètre (Ω)** : composant **hors tension**, si possible retiré du circuit.
- Le test de continuité (bip) vérifie qu'un fil ou une piste n'est pas coupé.
[[sch:mesure|L'ampèremètre en série, le voltmètre en parallèle]]
## L'oscilloscope
Il affiche la tension en fonction du temps. Deux réglages principaux : les **volts par division** (vertical) et le **temps par division** (horizontal). Un signal qui occupe 4 divisions avec 2 V/div a une amplitude crête à crête de 8 V. Une période sur 5 divisions à 1 ms/div donne T = 5 ms, soit f = 200 Hz.
## Bonnes habitudes
Commence par le plus grand calibre, puis descends. Relie toujours la masse de la sonde à la masse du montage.`,
f:['Voltmètre en parallèle, ampèremètre en série','U = divisions × V/div ; T = divisions × temps/div'],
q:[["Pour mesurer un courant, l'ampèremètre se branche :",['en parallèle','en série','sur la prise','hors tension'],1,"Le courant doit le traverser : en série."],
["On mesure une résistance :",['circuit sous tension','circuit hors tension','sur le calibre 10 A',"avec l'oscilloscope"],1,"Sous tension, la mesure est fausse et peut abîmer l'appareil."],
["Oscilloscope : 3 divisions avec 2 V/div. Tension ?",['1,5 V','5 V','6 V','0,67 V'],2,"3 × 2 = 6 V."],
["Une période sur 4 divisions à 5 ms/div. Fréquence ?",['20 Hz','50 Hz','200 Hz','5 Hz'],1,"T = 4 × 5 = 20 ms, donc f = 1 / 0,02 = 50 Hz."]]}]]);

acCat('Alimentation').unshift({id:'transfo',t:'Le transformateur',c:`## Le principe
Un transformateur est formé de deux bobines, le primaire et le secondaire, enroulées sur un même noyau de fer. Il **change la valeur d'une tension alternative** ; il ne fonctionne pas en continu.
[[sch:transfo|Primaire de N1 spires, secondaire de N2 spires]]
## Le rapport de transformation
U2 / U1 = N2 / N1. Si le secondaire a moins de spires, la tension baisse : c'est le cas des transformateurs d'alimentation 230 V → 12 V.
## Les courants
Un transformateur parfait transmet la puissance : U1 × I1 ≈ U2 × I2. Quand la tension baisse, le courant disponible augmente.
## L'isolation
Le primaire et le secondaire ne sont pas reliés électriquement : le transformateur **isole** le montage du secteur. C'est une protection importante.
## La puissance
Elle s'exprime en VA (voltampères). Un transformateur 12 V, 1 A fait 12 VA.`,

q:[["U1 = 230 V, N1 = 1000 spires, N2 = 52 spires. U2 ?",['environ 12 V','environ 23 V','environ 52 V','environ 4,4 V'],0,"U2 = 230 × 52 / 1000 ≈ 12 V."],
["Un transformateur fonctionne :",['en continu','en alternatif','avec une pile','sans tension'],1,"Il faut une tension qui varie pour induire une tension au secondaire."],
["Un transformateur abaisseur fournit au secondaire :",['moins de tension et plus de courant','plus de tension et plus de courant','la même tension','du continu'],0,"La puissance se conserve : U baisse, le courant disponible augmente."],
["Un transformateur 24 V, 2 A a une puissance de :",['12 VA','26 VA','48 VA','2 VA'],2,"24 × 2 = 48 VA."]]});
acCat('Semi-conducteurs').push({id:'triac_opto',t:'Thyristor, triac et optocoupleur',c:`## Le thyristor
C'est une diode « commandée » : il ne conduit, de l'anode vers la cathode, qu'après une impulsion sur sa **gâchette** (G). Une fois amorcé, il reste conducteur tant que le courant ne s'annule pas, même si la gâchette n'est plus commandée.
## Le triac
C'est l'équivalent de deux thyristors tête-bêche : il conduit **dans les deux sens**, donc en **alternatif**. Il sert à commander une lampe ou un moteur sur le secteur, et à faire des variateurs. Bornes : A1, A2 et gâchette G. Exemple : BTA16.
## L'optocoupleur
Une LED et un phototransistor (ou un phototriac) dans le même boîtier : la commande passe par la **lumière**, sans liaison électrique. Il **isole** le microcontrôleur du circuit de puissance. Exemples : PC817 (phototransistor), MOC3021 (phototriac, pour commander un triac).
## Sécurité
Un montage à triac est relié au secteur : boîtier fermé, distances d'isolement, et un adulte qualifié.`,
f:['Thyristor : amorcé par la gâchette, un seul sens','Triac : conduit dans les deux sens'],
q:[["Un triac conduit :",['dans un seul sens','dans les deux sens','seulement en continu','jamais'],1,"Deux thyristors tête-bêche : il commande de l'alternatif."],
["Pour amorcer un thyristor, on agit sur :",["l'anode",'la gâchette','la cathode','le boîtier'],1,"Une impulsion sur la gâchette le rend conducteur."],
["Un optocoupleur sert surtout à :",['amplifier','isoler deux circuits','redresser',"stocker de l'énergie"],1,"La commande passe par la lumière, sans contact électrique."],
["Le MOC3021 est :",['un régulateur','un optocoupleur à phototriac','un capteur de température','une diode Zener'],1,"Il commande la gâchette d'un triac en isolant le microcontrôleur."]]});
acCat('Logique et numération').push({id:'bascules',t:'Bascules, compteurs et registres',c:`## La logique séquentielle
Avec des portes seules, la sortie ne dépend que des entrées du moment (logique combinatoire). Une **bascule** a une **mémoire** : sa sortie dépend aussi de ce qui s'est passé avant.
## La bascule D
Au **front montant** de l'horloge H, la sortie Q recopie l'entrée D, puis la garde jusqu'au front suivant. Q̅ est toujours l'inverse de Q. Circuit : 74HC74.
[[sch:bascule|Bascule D : Q recopie D au front montant de l'horloge]]
## La bascule JK
J = 1 et K = 0 mettent Q à 1 ; J = 0 et K = 1 mettent Q à 0 ; J = K = 1 inversent Q à chaque front ; J = K = 0 ne changent rien.
## Les compteurs
En chaînant des bascules qui s'inversent, on divise la fréquence par 2 à chaque étage : n bascules comptent de 0 à 2ⁿ − 1. Exemples : 74HC393 (binaire), CD4017 (décimal à 10 sorties, idéal pour un chenillard).
## Les registres à décalage
Ils font avancer les bits d'une bascule à la suivante à chaque front. Le 74HC595 donne 8 sorties avec seulement 3 fils d'un microcontrôleur.`,
f:["Bascule D : au front d'horloge, Q = D",'n bascules : de 0 à 2ⁿ − 1','Chaque étage divise la fréquence par 2'],
q:[["Bascule D avec D = 1 : après un front montant, Q vaut :",['0','1',"l'inverse de D",'indéfini'],1,"Au front montant, Q recopie D."],
["Bascule JK avec J = K = 1 : à chaque front, Q :",['reste à 0','reste à 1',"s'inverse",'recopie J'],2,"J = K = 1 : la bascule s'inverse."],
["Un compteur à 4 bascules compte jusqu'à :",['4','8','15','16'],2,"De 0 à 2⁴ − 1 = 15."],
["Le 74HC595 sert à :",["multiplier les sorties d'un microcontrôleur",'réguler la tension','mesurer une distance','redresser'],0,"Registre à décalage : 8 sorties avec 3 fils."]]},
{id:'conversion',t:'Conversion analogique-numérique (CAN, CNA)',c:`## Pourquoi convertir ?
Un capteur donne une tension qui varie de façon continue (analogique). Un microcontrôleur ne connaît que des nombres : il faut un **convertisseur analogique-numérique (CAN, ou ADC)**. Pour produire une tension à partir d'un nombre, on utilise un **CNA (DAC)**.
## La résolution
Un CAN de n bits découpe la plage de tension en 2ⁿ niveaux. Le **pas** vaut q = Vref / 2ⁿ. Avec 10 bits et Vref = 5 V : q = 5 / 1024 ≈ 4,9 mV ; une variation plus petite n'est pas vue.
## Calculer
- Valeur lue N ≈ U / q, et U ≈ N × q.
- Arduino Uno : 10 bits, de 0 à 5 V. ESP32 : 12 bits, de 0 à 3,3 V environ.
## L'échantillonnage
On mesure à intervalles réguliers. Pour reproduire un signal, il faut échantillonner **plus de deux fois plus vite** que sa fréquence la plus haute (théorème de Shannon) : l'audio est échantillonné à 44,1 kHz pour des sons jusqu'à 20 kHz.
## Le CNA et la PWM
Beaucoup de microcontrôleurs n'ont pas de vrai CNA : on utilise la PWM suivie d'un filtre passe-bas pour obtenir une tension moyenne.`,
f:['q = Vref / 2ⁿ','U ≈ N × q','Échantillonner à plus de 2 × fmax'],
q:[["CAN 10 bits, Vref = 5 V. Pas q ?",['environ 4,9 mV','environ 49 mV','environ 0,5 V','5 V'],0,"q = 5 / 1024 ≈ 4,9 mV."],
["CAN 8 bits : nombre de niveaux ?",['8','100','256','1024'],2,"2⁸ = 256 niveaux."],
["Pour un signal jusqu'à 1 kHz, on échantillonne au moins à :",['500 Hz','1 kHz','2 kHz','100 Hz'],2,"Plus de deux fois la fréquence maximale : au moins 2 kHz."],
["Sans vrai CNA, on obtient une tension variable avec :",['la PWM et un filtre passe-bas','un relais','une diode Zener seule','un HC-SR04'],0,"Le filtre garde la valeur moyenne de la PWM."]]});

Object.assign(SIMS,{
 redress:{t:'Redressement et filtrage',ch:'diode',p:[{k:'mode',l:'Redressement',o:[['double','Double alternance (pont de diodes)'],['simple','Simple alternance (1 diode)']],v:'double'},{k:'V',l:'Transformateur (tension efficace)',o:[['6','6 V'],['9','9 V'],['12','12 V'],['15','15 V'],['24','24 V']],v:'12'},{k:'Ci',l:'Condensateur de filtrage',min:0,max:CAPS.length-1,step:1,v:4,f:i=>CAPS[i]?CAPS[i]+' µF':'aucun'},{k:'Li',l:'Charge',min:0,max:LOADS.length-1,step:1,v:3,f:i=>fR(LOADS[i])}],
  run(p){const dbl=p.mode==='double',Vp=+p.V*Math.SQRT2,drop=dbl?1.4:.7,C=CAPS[p.Ci]*1e-6,RL=LOADS[p.Li],dt=5e-5,T=.06,rect=[],out=[];let v=0,last=[];
   for(let t=0;t<=T+1e-9;t+=dt){const s=Vp*Math.sin(2*Math.PI*50*t),r=Math.max(0,(dbl?Math.abs(s):s)-drop);v=C?Math.max(r,v*Math.exp(-dt/(RL*C))):r;if(Math.round(t/dt)%4===0){rect.push([t*1000,r]);out.push([t*1000,v])}if(t>=.04)last.push(v)}
   const mx=Math.max(...last),mn=Math.min(...last),moy=last.reduce((a,x)=>a+x,0)/last.length,f=dbl?100:50,est=C?(mx/RL)/(f*C):null;
   return{out:`Tension crête redressée : ${fV(Vp-drop)} (${frN(+p.V,0)} V × √2 − ${frN(drop,1)} V pour ${dbl?'les 2 diodes':'la diode'}).<br>Tension moyenne en sortie : <b>${fV(moy)}</b> · ondulation : <b>${fV(mx-mn)}</b>${est!=null?` (formule ΔV ≈ I / (f × C) = ${fV(est)}, avec f = ${f} Hz)`:''}.<br>${!C?'Sans condensateur, la tension retombe à 0 à chaque alternance : inutilisable pour un montage électronique.':mx-mn>mx*.2?'Ondulation forte : prends un condensateur plus gros (ou une charge plus faible).':'<span style="color:var(--grade-good)">Tension bien lissée.</span>'}`,

 filtre:{t:'Filtre RC passe-bas / passe-haut',ch:'filtres',p:[{k:'type',l:'Type de filtre',o:[['bas','Passe-bas'],['haut','Passe-haut']],v:'bas'},{k:'R',l:'Résistance R',min:.1,max:100,step:.1,v:1.6,f:v=>frN(v,1)+' kΩ'},{k:'Ci',l:'Condensateur C',min:0,max:FCAPS.length-1,step:1,v:4,f:i=>FCAPS[i]>=1000?frN(FCAPS[i]/1000,0)+' µF':FCAPS[i]+' nF'},{k:'lf',l:'Fréquence du signal',min:1,max:5,step:.05,v:3,f:v=>fHz(Math.pow(10,v))}],

    ${wrong.length?`<section class="panel"><h3>À relire</h3><div class="aclist">${wrong.map(id=>{const c=acCh(id);return c?`<button class="acrow" data-act="ac-open" data-id="${id}"><span class="acdot"></span><span class="grow"><b>${esc(c.t)}</b><small>${esc(c.cat)}</small></span><span class="chev">›</span></button>`:''}).join('')}</div></section>`:''}
    <div class="row wrap" style="gap:8px;margin-top:12px"><button class="btn" data-act="ac-exam">Un autre examen blanc</button></div>`}
  let h=_vAcad51();
  if(ac.view==='home'){const ex=ACF().exams||[],best=ex.length?Math.max(...ex.map(x=>x.note)):null;

  return h};

{id:'dp_budget',t:'Gérer son argent : le budget',c:`## Pourquoi un budget ?
Sans budget, l'argent part « tout seul » : un peu de crédit, un repas, un abonnement… et à la fin du mois, on ne sait plus où il est allé. Un budget, c'est simplement **décider à l'avance** à quoi servira ton argent.
## La méthode 50 / 30 / 20
Sur ce que tu reçois (argent de poche, petits travaux, stage, salaire plus tard) :
- **50 %** pour l'indispensable : transport, nourriture, fournitures, factures ;
- **30 %** pour les envies : sorties, vêtements, jeux ;
- **20 %** pour l'épargne et tes projets.
Ce sont des repères : adapte-les, mais garde toujours une part pour l'épargne.
## Suivre ses dépenses
Pendant un mois, note chaque dépense (un carnet ou une feuille sur le téléphone). Tu découvriras vite les « petites fuites » : 200 F par-ci, 500 F par-là, qui font plusieurs milliers à la fin du mois.
## Le Mobile Money
Pratique, mais il facilite les dépenses impulsives. Consulte ton historique chaque semaine, ne prête jamais ton code, et garde à l'esprit les frais de retrait.
## Le piège des comparaisons
Ce que les autres montrent sur les réseaux sociaux n'est pas leur vraie vie financière. Dépense selon **tes** objectifs, pas pour impressionner.`,

["La première étape pour reprendre le contrôle de ses dépenses :",['emprunter','noter toutes ses dépenses pendant un mois','arrêter de manger dehors définitivement','ouvrir plusieurs comptes'],1,"On ne peut améliorer que ce que l'on mesure."],
["Les « petites fuites » d'argent sont :",['les gros achats rares','les petites dépenses répétées','les impôts','les cadeaux de fête'],1,"200 F plusieurs fois par jour finissent par coûter très cher."],
["Avec le Mobile Money, il faut surtout :",['partager son code avec un ami de confiance','vérifier son historique et garder son code secret','retirer tout son argent chaque jour','accepter les transferts inconnus'],1,"Ton code est personnel : personne n'a besoin de le connaître."]]},
{id:'dp_epargne',t:"Épargner et faire grandir son argent",c:`## Se payer en premier
Dès que tu reçois de l'argent, mets **d'abord** ta part d'épargne de côté, puis dépense le reste. Si tu attends la fin du mois pour épargner « ce qui reste », il ne reste presque jamais rien.
## Le fonds d'urgence
C'est une réserve pour les imprévus (téléphone cassé, santé, transport). Objectif quand tu travailles : l'équivalent de **3 à 6 mois** de dépenses. Il évite de s'endetter au premier problème.
## La force des intérêts composés
Quand ton argent rapporte des intérêts et que tu laisses ces intérêts travailler, ils rapportent à leur tour. Exemple : 10 000 F placés à 10 % par an deviennent environ 11 000 F après 1 an, 16 100 F après 5 ans et 25 900 F après 10 ans. **Le temps** est ton meilleur allié : commence tôt, même petit.
## Tontine, banque, placement
- **La tontine** aide à épargner régulièrement grâce au groupe, mais repose sur la confiance : choisis des personnes fiables et un fonctionnement clair.
- **Le compte d'épargne** est sûr mais rapporte peu.
- **Investir** (entreprise, actions, immobilier…) peut rapporter plus, mais avec un **risque** de perte. Règle d'or : n'investis que ce que tu peux te permettre de perdre, et comprends toujours où va ton argent.
## Diversifier
Ne mets pas tous tes œufs dans le même panier : répartis ton épargne.`,

q:[["« Se payer en premier » veut dire :",["épargner ce qui reste à la fin du mois","mettre l'épargne de côté dès qu'on reçoit l'argent","s'acheter un cadeau à chaque paie","rembourser ses dettes en dernier"],1,"On épargne d'abord, on dépense ensuite le reste."],
["À quoi sert un fonds d'urgence ?",['à acheter le dernier téléphone','à faire face aux imprévus sans s\'endetter','à jouer aux paris','à prêter aux amis'],1,"C'est une sécurité contre les mauvaises surprises."],
["Pourquoi commencer à épargner jeune ?",['parce que les intérêts composés ont plus de temps pour agir','parce que la banque le demande','parce que l\'argent perd toujours sa valeur','ce n\'est pas utile'],0,"Plus l'argent reste placé longtemps, plus il grandit."],

{id:'dp_arnaques',t:'Crédits, dettes et arnaques',c:`## Le crédit n'est pas de l'argent gratuit
Emprunter coûte des **intérêts** : on rembourse plus que ce qu'on a reçu. Un crédit peut se justifier pour un projet qui rapporte (outil de travail, formation), rarement pour consommer (sorties, téléphone dernier cri).
## Avant d'emprunter
- Combien vais-je rembourser **au total** ?
- Pourrai-je payer chaque échéance, même en cas d'imprévu ?
- Est-ce un besoin ou une envie ?
Évite d'emprunter pour rembourser une autre dette : c'est le début de la spirale.
## Les arnaques les plus courantes
- **« Doublement d'argent »** et placements « garantis » à 30 % par mois : impossible. Ce sont souvent des **systèmes pyramidaux** (Ponzi) : les premiers sont payés avec l'argent des suivants, puis tout s'effondre.
- **Faux recrutements** qui demandent des « frais de dossier ».
- **Faux messages** Mobile Money (« vous avez reçu par erreur, renvoyez ») : vérifie toujours ton solde réel.
- Inconnus en ligne qui demandent de l'argent ou des photos : c'est souvent de la cyberescroquerie.
## Les réflexes de sécurité
Ne donne jamais ton code secret ni un code reçu par SMS. Méfie-toi de l'urgence (« décide maintenant ! ») et des promesses trop belles. En cas de doute, parle-en à un adulte de confiance avant d'agir.`,

["Un crédit se justifie plutôt pour :",['une sortie entre amis','un projet qui rapporte, comme un outil de travail','rembourser un autre crédit','un téléphone de luxe'],1,"Emprunter pour consommer appauvrit ; emprunter pour produire peut enrichir."]]}]],
['Réussir sa vie',[
{id:'dp_habitudes',t:'Habitudes et discipline',c:`## Les habitudes font la différence
Ce que tu fais **chaque jour** compte plus que ce que tu fais une fois de temps en temps. Réviser 20 minutes par jour bat une nuit blanche avant l'examen.
## Commence petit
Une habitude trop ambitieuse est vite abandonnée. Commence par une version si facile qu'elle est impossible à rater : relire une page, faire 10 pompes, ranger son bureau. La **régularité** compte plus que la quantité au début.
## Accroche l'habitude à une autre
« Après le repas du soir, je révise 20 minutes. » Une action déjà installée sert de déclencheur.
## Prépare ton environnement
Rends la bonne habitude facile (cahier ouvert sur la table) et la mauvaise difficile (téléphone dans une autre pièce pendant le travail).
## La motivation ne suffit pas
La motivation va et vient. Le **système** (horaires, lieu, petit objectif) te porte les jours sans envie. Ne rate jamais deux jours de suite : un oubli arrive, deux deviennent une nouvelle habitude.
## La procrastination
Pour démarrer une tâche qui fait peur, engage-toi seulement pour **2 minutes**. Une fois lancé, continuer est bien plus facile. Le minuteur de l'appli (25 minutes) t'aide aussi.`,

{id:'dp_temps',t:'Gérer son temps et ses priorités',c:`## Urgent ou important ?
Classe tes tâches en quatre cases :
- **Important et urgent** : à faire tout de suite (devoir à rendre demain).
- **Important mais pas urgent** : à planifier (réviser l'examen dans un mois, apprendre une compétence). C'est la case qui construit ton avenir.
- **Urgent mais pas important** : à limiter ou déléguer (beaucoup de messages).
- **Ni urgent ni important** : à supprimer (faire défiler les vidéos sans fin).
## Planifier la semaine
Le dimanche, regarde la semaine : cours, devoirs, examens, activités. Bloque des moments précis pour les tâches importantes, comme des rendez-vous avec toi-même.
## Savoir dire non
Chaque « oui » à une distraction est un « non » à tes objectifs. Tu peux refuser poliment : « Pas ce soir, je révise ; samedi si tu veux. »
## Le téléphone
Coupe les notifications pendant le travail. Une seule interruption peut coûter plusieurs minutes de concentration.
## Le sommeil n'est pas du temps perdu
Bien dormir améliore la mémoire et la concentration. Réviser tard au lieu de dormir est souvent un mauvais calcul.`,

{id:'dp_communication',t:'Communiquer et se faire respecter',c:`## Écouter vraiment
Écouter, ce n'est pas attendre son tour pour parler. Regarde la personne, laisse-la finir, puis reformule : « Si je comprends bien, tu dis que… ». Les gens se sentent respectés et les malentendus diminuent.
## Parler en « je »
Au lieu de « Tu es toujours en retard ! », dis : « Quand tu arrives en retard, je perds du temps et ça m'énerve. Peux-tu me prévenir ? ». On décrit un fait, son ressenti et une demande : l'autre se défend moins.
## S'affirmer sans agresser
Être affirmé, c'est dire ce qu'on pense calmement, avec respect, sans écraser l'autre ni se laisser écraser. On peut refuser, poser une limite, demander de l'aide.
## Gérer un conflit
Calme-toi d'abord (respire, éloigne-toi un moment). Parle du problème, pas de la personne. Cherche une solution où chacun gagne quelque chose. La violence, physique ou verbale, ne règle jamais rien durablement.
## Prendre la parole en public
Prépare 3 idées principales, entraîne-toi à voix haute, regarde ton public et parle lentement. Le trac est normal : il diminue avec la pratique. Les exposés en classe et le club de robotique sont d'excellents entraînements.
## Le respect et le consentement
Respecter l'autre, c'est aussi respecter ses « non », en amitié comme en amour. Un « non » ne se discute pas et ne se force pas.`,

{id:'dp_confiance',t:'Confiance en soi et émotions',c:`## La confiance se construit
On ne naît pas confiant : la confiance grandit en **agissant**. Chaque petit défi réussi (un exposé, un montage qui fonctionne, une note améliorée) est une preuve que tu en es capable. Garde une trace de tes réussites.
## L'échec est un professeur
Un circuit qui ne marche pas t'apprend plus qu'un circuit qui marche du premier coup. Remplace « je suis nul » par « je ne sais pas **encore** faire ». Ceux qui réussissent ont souvent échoué plus que les autres.
## Les réseaux sociaux
On y voit les meilleurs moments des autres, jamais leurs difficultés. Compare-toi à **toi-même hier**, pas aux autres.
## Gérer ses émotions
Colère, stress, tristesse sont normaux. Pour retrouver son calme : respirer lentement (l'appli propose « Respirer 1 minute »), marcher, écrire ce qu'on ressent, faire du sport.
## Demander de l'aide
Parler à quelqu'un de confiance (parent, ami, enseignant, éducateur) n'est pas une faiblesse : c'est une force. Si une tristesse ou un mal-être dure, ou devient trop lourd, il faut en parler à un adulte ou à un professionnel de santé.`,

{id:'dp_sante',t:'Hygiène de vie : sommeil, sport, écrans',c:`## Le sommeil
À ton âge, le corps et le cerveau ont besoin d'environ **8 à 10 heures** de sommeil par nuit. Le sommeil fixe ce que tu as appris dans la journée. Évite les écrans juste avant de dormir : leur lumière retarde l'endormissement.
## Bouger
L'OMS recommande aux jeunes environ **une heure d'activité physique par jour** : marche rapide, football, vélo, danse… Le sport améliore l'humeur, la concentration et le sommeil.
## Manger équilibré
Varie les aliments, mange des fruits et légumes, bois de l'eau régulièrement, surtout quand il fait chaud. Limite les boissons très sucrées. Un vrai petit-déjeuner aide à suivre les cours du matin.
## Les écrans
Fixe-toi des moments sans écran, notamment pendant les révisions et avant de dormir. Les jeux et vidéos sont plus agréables quand ils restent une récompense, pas une fuite.
## Ce qu'il vaut mieux éviter
Le tabac, l'alcool et les drogues abîment la santé, la mémoire et l'argent, et créent une dépendance. Savoir dire non à la pression du groupe est une preuve de caractère.`,

['Avenir et travail',[
{id:'dp_carriere',t:'Préparer son avenir professionnel',c:`## Les compétences comptent autant que le diplôme
Le diplôme ouvre des portes ; les **compétences** prouvées te font avancer. En électronique : savoir souder, lire un schéma, dépanner, programmer un microcontrôleur, travailler proprement et en sécurité.
## Construis ton portfolio
Garde des photos, des vidéos et des explications de tes projets : robot, montages, stage au fablab, réparations. Un employeur ou un client croit plus facilement ce qu'il voit.
## Le CV
Une page, claire : coordonnées, formation, compétences, projets et stages, langues. Mets en avant ce que tu as **réalisé** (« J'ai conçu un robot piloté par Wi-Fi ») plutôt que des qualités vagues.
## L'entretien
Renseigne-toi sur l'entreprise, prépare des exemples concrets de tes réalisations, sois ponctuel et poli, pose une ou deux questions à la fin. Remercie après l'entretien.
## Le réseau
Professeurs, maîtres de stage, camarades, clubs : beaucoup d'opportunités viennent des personnes qui te connaissent et ont vu ton sérieux. Entretiens ces liens.
## Apprendre toute sa vie

## Argent
- **L'homme le plus riche de Babylone** (George S. Clason) : des paraboles simples sur l'épargne (garder une part de chaque gain), faire travailler son argent et se méfier des placements douteux.
- **La psychologie de l'argent** (Morgan Housel) : bien gérer son argent dépend plus du comportement (patience, prudence) que de l'intelligence.
- **Père riche, père pauvre** (Robert Kiyosaki) : fait réfléchir à la différence entre ce qui rapporte de l'argent et ce qui en coûte. À lire avec esprit critique : certains conseils sont risqués.
## Habitudes et efficacité
- **Un rien peut tout changer** (James Clear, titre original « Atomic Habits ») : comment de petites habitudes, répétées, transforment une vie.
- **Les 7 habitudes de ceux qui réalisent tout ce qu'ils entreprennent** (Stephen Covey) : être proactif, savoir où l'on va, faire passer l'important d'abord, chercher le gagnant-gagnant.
- **Changer d'état d'esprit** (Carol Dweck, titre original « Mindset ») : croire qu'on peut progresser aide réellement à progresser.
## Relations
- **Comment se faire des amis** (Dale Carnegie) : s'intéresser sincèrement aux autres, écouter, éviter les critiques inutiles.
## Romans qui font réfléchir
- **L'Alchimiste** (Paulo Coelho) : un conte sur le courage de suivre son chemin.
- **L'Aventure ambiguë** (Cheikh Hamidou Kane) : un grand roman africain sur l'école, la tradition et le choix de sa voie.
- **Une si longue lettre** (Mariama Bâ) : un classique sur la société, la dignité et le respect.
